name = "ihype"
main = "worker.js"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "no_handle_cross_request_promise_resolution"]
find_additional_modules = true
rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = true }
]
base_dir = ".open-next/server-functions/default"
# Production routes for ihype.org and www.ihype.org are managed in the Cloudflare dashboard.
workers_dev = false

# bcryptjs with 10 salt rounds needs ~200ms CPU; raise the limit so auth routes don't hit the 30ms default.
[limits]
cpu_ms = 1500

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# Exposes the exact Cloudflare Worker version ID/tag to the runtime so error
# reports can be tied to one deploy without maintaining a mutable plain var.
[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
AUTH_TRUST_HOST = "true"
AUTH_URL = "https://ihype.org"
NEXT_PUBLIC_APP_URL = "https://ihype.org"
NEXT_PUBLIC_BASE_URL = "https://ihype.org"
R2_PUBLIC_BASE_URL = "https://ihype.org"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADSF8WNxaeBIRmR7"
# Not NEXT_PUBLIC_-prefixed on purpose — this is read at runtime via the
# Workers `env` binding by worker.js's Sentry.withSentry() wrap and by
# src/lib/logger.ts's server-side capture, never inlined into client JS.
# A Sentry DSN isn't a secret (safe to be public/client-embeddable), so a
# plain var is correct here too. See worker.js for why @sentry/cloudflare
# is used instead of @sentry/nextjs's server config (which crashed the
# Worker — an unresolved upstream AsyncLocalStorage cross-request bug).
SENTRY_DSN = "https://6fcca4160df1fe7b0d5e3aa4b7a73f44@o4511334761103360.ingest.us.sentry.io/4511334762741760"
# Paid ticketing must remain an explicit configuration change, not dashboard residue.
#
# FALSE as of 2026-08-27, deliberately, and turning it back on is a decision
# with a prerequisite rather than a config tweak.
#
# It was true from 2026-07-19 with both live Stripe secrets set and the webhook
# verified, so the buy path was ARMED in production for five weeks. What was
# never true in that window is that anyone could be PAID: Stripe Connect has
# never been signed up for on the iHYPE account, so `createPayoutTransfer()`
# has no destination to transfer to.
#
# That combination is the worst shape this system can take, because it fails
# silently and on the far side of the money. A fan buys, the charge captures to
# the platform balance, the order reads CAPTURED, the ticket scans — and every
# AccountsPayableEntry sits PENDING forever with nothing able to release it.
# The artist's 70% would be sitting in iHYPE's Stripe balance with no mechanism
# to send it. Nothing in the app would report a fault, because nothing is
# faulty: the payout cron correctly finds no connected account.
#
# It cost nothing only because live Stripe holds zero PaymentIntents — the flag
# was armed but never fired. Do not read those five weeks as evidence that this
# is safe.
#
# Re-enable only after docs/runbooks/money-path-rehearsal.md is walked to the
# end, which means Connect enabled, an Express account through hosted
# onboarding, a real transfer reaching a real destination, and the payout cron
# run TWICE showing `released: 0` on the second pass. A cron that pays twice is
# invisible until it happens.
FEATURE_ENABLE_TICKET_PAYMENTS = "false"

[[kv_namespaces]]
binding = "KV"
id = "b6330641874a4420b240d3a82760a9aa"
preview_id = "eb2e8a134c184a13a71710ec0287b958"

[[r2_buckets]]
binding = "R2"
bucket_name = "ihype-media"
preview_bucket_name = "ihype-media-preview"

# Pooled Postgres access — read by src/lib/db.ts, which falls back to
# DATABASE_URL when the binding is absent (local dev, build, scripts).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "03f39c51f80a45d3bb6792a9676e292e"

# Atomic rate-limit counters — class defined in worker.js, consumed by
# src/lib/rate-limit.ts (falls back to KV when the binding is absent).
[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[analytics_engine_datasets]]
binding = "AE"
dataset = "ihype_analytics"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "ihype"

[ai]
binding = "AI"

[build]
command = "npm run cf:build"
