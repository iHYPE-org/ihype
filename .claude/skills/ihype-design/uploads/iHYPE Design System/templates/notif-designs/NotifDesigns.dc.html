<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<!-- @template name="iHYPE Notification Designs" description="iOS lock-screen notification mockups — ticket drop, hype earned, radio live, payout, verification." -->
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}button{transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s ease,filter .16s ease}button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}a{transition:filter .16s ease,transform .16s ease}@keyframes ihFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}body>div{animation:ihFadeUp .5s cubic-bezier(.16,1,.3,1) both}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}body{-webkit-font-smoothing:antialiased}</style>
</helmet>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(160deg,#2a1a3a,#0a0805 60%);font-family:'DM Sans',sans-serif;border-radius:52px">
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 70% 15%,rgba(255,255,255,.12),transparent 55%)"></div>
  <div style="position:relative;text-align:center;padding-top:70px">
    <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:76px;color:#fff;letter-spacing:-.02em">9:41</div>
    <div style="font-size:17px;color:rgba(255,255,255,.85);margin-top:4px">Friday, July 24</div>
  </div>
  <div style="position:relative;padding:36px 14px 0;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{ notifs }}" as="n" hint-placeholder-count="5">
      <div style="display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(20px)">
        <sc-if value="{{ n.isAccent }}"><div style="width:34px;height:34px;border-radius:9px;background:#ff5029;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px">{{ n.icon }}</div></sc-if>
        <sc-if value="{{ n.isPink }}"><div style="width:34px;height:34px;border-radius:9px;background:#ff3e9a;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px">{{ n.icon }}</div></sc-if>
        <sc-if value="{{ n.isBlue }}"><div style="width:34px;height:34px;border-radius:9px;background:#5b8cff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px">{{ n.icon }}</div></sc-if>
        <sc-if value="{{ n.isTeal }}"><div style="width:34px;height:34px;border-radius:9px;background:#22e5d4;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px">{{ n.icon }}</div></sc-if>
        <sc-if value="{{ n.isPurple }}"><div style="width:34px;height:34px;border-radius:9px;background:#b983ff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px">{{ n.icon }}</div></sc-if>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:700;font-size:13px;color:#fff">iHYPE</span><span style="font-size:11px;color:rgba(255,255,255,.55)">{{ n.when }}</span></div>
          <div style="font-weight:600;font-size:13px;color:#fff;margin-top:2px">{{ n.title }}</div>
          <div style="font-size:12px;color:rgba(255,255,255,.75);margin-top:1px;line-height:1.4">{{ n.body }}</div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.5)"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;844px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      notifs: [
        { icon: '🎟️', isAccent: true, when: 'now', title: 'Tickets dropped', body: 'Midnight Echo — Live at The Echo. You get first access.' },
        { icon: '🔥', isPink: true, when: '2m', title: 'You earned $3.60', body: 'A friend bought a ticket through your referral link.' },
        { icon: '📻', isBlue: true, when: '18m', title: 'Nyla is on air', body: 'Late Set radio just went live — tap to tune in.' },
        { icon: '✓', isTeal: true, when: '1h', title: "You're verified", body: 'Your artist page now shows the ✓ badge.' },
        { icon: '💸', isPurple: true, when: '3h', title: 'Payout sent', body: '$8,075.20 was transferred to your Stripe account.' },
      ],
    };
  }
}

</script>
</body>
</html>
