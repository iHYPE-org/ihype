<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title description">
  <title id="title">Local music signal waiting for an upload</title>
  <desc id="description">Abstract orange and teal sound waves without embedded lettering</desc>
  <defs>
    <linearGradient id="surface" x1="92" y1="72" x2="814" y2="1134" gradientUnits="userSpaceOnUse">
      <stop stop-color="#170c09"/><stop offset=".48" stop-color="#07090d"/><stop offset="1" stop-color="#041417"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientTransform="translate(160 408) rotate(25) scale(520 610)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4d2e" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(742 668) rotate(154) scale(520 610)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18ded1" stop-opacity=".38"/><stop offset="1" stop-color="#18ded1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="110" y1="0" x2="790" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4d2e"/><stop offset=".48" stop-color="#ff4d2e"/><stop offset=".52" stop-color="#18ded1"/><stop offset="1" stop-color="#18ded1"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="9" r="1" fill="#f3eee7" fill-opacity=".08"/><circle cx="28" cy="31" r="1" fill="#f3eee7" fill-opacity=".05"/><circle cx="39" cy="13" r=".7" fill="#f3eee7" fill-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#surface)"/>
  <rect width="900" height="1200" fill="url(#orangeGlow)"/>
  <rect width="900" height="1200" fill="url(#cyanGlow)"/>
  <g fill="none" stroke="#f3eee7" stroke-opacity=".075">
    <circle cx="450" cy="492" r="132"/><circle cx="450" cy="492" r="220"/><circle cx="450" cy="492" r="316"/><circle cx="450" cy="492" r="414"/>
  </g>
  <path d="M80 492h740" stroke="url(#signal)" stroke-width="8" stroke-linecap="round" opacity=".24" filter="url(#softGlow)"/>
  <g fill="url(#signal)">
    <rect x="82" y="486" width="68" height="12" rx="6"/><rect x="170" y="442" width="12" height="100" rx="6"/><rect x="205" y="388" width="12" height="208" rx="6"/><rect x="240" y="458" width="12" height="68" rx="6"/><rect x="275" y="342" width="12" height="300" rx="6"/><rect x="310" y="416" width="12" height="152" rx="6"/><rect x="345" y="468" width="12" height="48" rx="6"/><rect x="380" y="430" width="12" height="124" rx="6"/><rect x="415" y="364" width="12" height="256" rx="6"/><rect x="444" y="300" width="12" height="384" rx="6"/><rect x="473" y="402" width="12" height="180" rx="6"/><rect x="508" y="460" width="12" height="64" rx="6"/><rect x="543" y="414" width="12" height="156" rx="6"/><rect x="578" y="348" width="12" height="288" rx="6"/><rect x="613" y="438" width="12" height="108" rx="6"/><rect x="648" y="396" width="12" height="192" rx="6"/><rect x="683" y="454" width="12" height="76" rx="6"/><rect x="716" y="486" width="102" height="12" rx="6"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M126 842c118-102 208-154 324-154 121 0 214 54 324 154" stroke="#18ded1" stroke-opacity=".22" stroke-width="2"/>
    <path d="M184 900c91-78 166-118 266-118 102 0 180 42 266 118" stroke="#ff4d2e" stroke-opacity=".2" stroke-width="2"/>
  </g>
  <circle cx="450" cy="492" r="22" fill="#f3eee7"/><circle cx="450" cy="492" r="10" fill="#050708"/>
  <rect width="900" height="1200" fill="url(#grain)"/>
