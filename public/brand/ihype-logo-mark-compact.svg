<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ihype-compact-title ihype-compact-desc">
  <title id="ihype-compact-title">iHYPE</title>
  <desc id="ihype-compact-desc">The iHYPE wordmark above a Local Music label and a crowd of raised hands.</desc>

  <!--
    The small-size cut of the mark, for the 48-56px nav tile. Same three
    elements as ihype-logo-mark.svg, re-proportioned rather than re-drawn:

      - wordmark 28% larger, so the accent "i" survives at 48px;
      - the LOCAL MUSIC label knocked out of a solid accent bar. Cream-on-tile
        loses too much of its stroke to antialiasing at 3px; knockout on a
        filled bar keeps the label as one high-contrast shape even when the
        individual letters stop resolving;
      - one rank of larger figures instead of two. The second rank is depth,
        and depth is the first thing that turns to mush when a 512-unit
        drawing is painted into 48 pixels.

    Use ihype-logo-mark.svg anywhere with 64px or more to give it.
    Literal colours for the same reason as that file. design-exempt: brand asset.
  -->

  <defs>
    <linearGradient id="ihype-c-tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15120d" />
      <stop offset="1" stop-color="#0a0805" />
    </linearGradient>
    <radialGradient id="ihype-c-stage" cx="256" cy="506" r="268" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5029" stop-opacity=".5" />
      <stop offset="1" stop-color="#ff5029" stop-opacity="0" />
    </radialGradient>
    <clipPath id="ihype-c-clip"><rect class="ihype-tile-shape" width="512" height="512" rx="112" /></clipPath>
    <g id="ihype-c-fan">
      <path d="M-35 0c0-20 15-31 35-31s35 11 35 31z" />
      <circle cx="0" cy="-50" r="19" />
      <rect x="-35" y="-6" width="70" height="200" />
    </g>
    <g id="ihype-c-arm"><rect x="-6" y="-112" width="12" height="112" rx="6" /></g>
  </defs>

  <g clip-path="url(#ihype-c-clip)">
    <rect width="512" height="512" fill="url(#ihype-c-tile)" />
    <rect width="512" height="512" fill="url(#ihype-c-stage)" />

    <g fill="#ff5029">
      <use href="#ihype-c-fan" transform="translate(20 460)" />
      <use href="#ihype-c-fan" transform="translate(98 460)" />
      <use href="#ihype-c-fan" transform="translate(176 460)" />
      <use href="#ihype-c-fan" transform="translate(254 460)" />
      <use href="#ihype-c-fan" transform="translate(332 460)" />
      <use href="#ihype-c-fan" transform="translate(410 460)" />
      <use href="#ihype-c-fan" transform="translate(488 460)" />
      <use href="#ihype-c-arm" transform="translate(140 442) rotate(-13)" />
      <use href="#ihype-c-arm" transform="translate(296 442) rotate(10)" />
      <use href="#ihype-c-arm" transform="translate(432 442) rotate(-7)" />
    </g>

    <!-- Wordmark: the same 100-unit drawing as the full mark, scaled to 360. -->
    <g transform="translate(76 96) scale(.963)">
      <g fill="#ff5029">
        <rect width="24" height="20" rx="4" />
        <rect y="28" width="24" height="72" rx="3" />
      </g>
      <g fill="#f0ebe5">
        <rect x="36" width="24" height="100" rx="3" />
        <rect x="96" width="24" height="100" rx="3" />
        <rect x="36" y="38" width="84" height="22" />
        <path d="M132 0h26l13 32 13-32h26l-27 62v38h-24v-38z" />
        <path fill-rule="evenodd" d="M222 0h36c22 0 38 12 38 29s-16 29-38 29h-12v42h-24zm24 20v18h12c8 0 13-4 13-9s-5-9-13-9z" />
        <rect x="308" width="24" height="100" rx="3" />
        <rect x="308" width="66" height="24" rx="3" />
        <rect x="308" y="38" width="58" height="22" />
        <rect x="308" y="76" width="66" height="24" rx="3" />
      </g>
    </g>

    <!-- | LOCAL MUSIC | knocked out of the accent bar. The letters are stroked
         in the tile colour over the bar rather than masked out of it — same
         result, one fewer paint server to resolve in a favicon context. -->
    <rect x="56" y="214" width="400" height="78" rx="16" fill="#ff5029" />
    <g transform="translate(66 235) scale(1.044)" fill="none" stroke="#0a0805" stroke-width="7" stroke-linecap="square">
      <path d="M3.5-2V32" />
      <path d="M26.5 0v26.5H43" />
      <rect x="52.5" y="3.5" width="23" height="23" rx="11.5" />
      <path d="M108 7a11.5 11.5 0 1 0 0 16" />
      <path d="M120.5 28 130 2l9.5 26M123 20h14" />
      <path d="M152.5 0v26.5H169" />
      <path d="M196.5 30V3l13.5 17L223.5 3v27" />
      <path d="M236.5 0v13a12.5 12.5 0 0 0 25 0V0" />
      <path d="M292 8c0-5-6-7.5-10.5-7.5S274 4 274 8s4 6.5 9 7c5 .5 9 3 9 7s-5 7.5-10 7.5S273 27 272 24" />
      <path d="M304.5 0v30" />
      <path d="M337 7a11.5 11.5 0 1 0 0 16" />
      <path d="M360-2V32" />
    </g>

    <rect class="ihype-tile-edge" x=".75" y=".75" width="510.5" height="510.5" rx="111.25" fill="none" stroke="#f0ebe5" stroke-opacity=".14" stroke-width="1.5" />
  </g>
</svg>
