<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ihype-compact-title ihype-compact-desc">
  <title id="ihype-compact-title">iHYPE</title>
  <desc id="ihype-compact-desc">The iHYPE wordmark above a Local Music label and a crowd of people with their hands up.</desc>

  <!--
    The small-size cut of the mark, for the 44-54px nav tile. Same three
    elements and the same figure library as ihype-logo-mark.svg, re-proportioned
    rather than re-drawn:

      - wordmark 28 percent larger, so the accent "i" survives at 48px;
      - the LOCAL MUSIC label knocked out of a solid accent bar. Cream-on-tile
        loses too much of its stroke to antialiasing at 3px; knockout on a
        filled bar keeps the label as one high-contrast shape even when the
        individual letters stop resolving;
      - SEVEN figures where the full mark has twenty-one. A crowd reads by its
        skyline, and at 48px a dense one has no pixels left to draw one with -
        the individual heads fall below a pixel and the whole band flattens into
        a bar. Fewer, larger people keep the silhouette legible.

    Use ihype-logo-mark.svg anywhere with 64px or more to give it.
    Literal colours for the same reason as that file. design-exempt: brand asset.
  -->

  <defs>
    <linearGradient id="ihype-c-tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15120d" />
      <stop offset="1" stop-color="#0a0805" />
    </linearGradient>
    <radialGradient id="ihype-c-stage" cx="256" cy="506" r="268" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5029" stop-opacity=".5" />
      <stop offset="1" stop-color="#ff5029" stop-opacity="0" />
    </radialGradient>
    <clipPath id="ihype-c-clip"><rect class="ihype-tile-shape" width="512" height="512" rx="112" /></clipPath>

    <!-- Origin is the TOP OF THE HEAD, y growing down, so a figure is placed by
         where its head lands rather than by a baseline nothing can see. -->
    <g id="ihype-c-p1"><!-- short hair, both hands up -->
      <ellipse cx="0" cy="22" rx="19" ry="22" />
      <path d="M-9 36h18v20h-18z" />
      <path d="M-10 53C-28 56-40 68-43 92l-4 120h94l-4-120c-3-24-15-36-33-39z" />
      <path d="M-30 74-52 24-48-26" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-48" cy="-33" r="8.5" />
      <path d="M30 74 52 24 48-26" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="48" cy="-33" r="8.5" />
    </g>
    <g id="ihype-c-p2"><!-- bun, one arm up holding a phone -->
      <ellipse cx="0" cy="24" rx="18" ry="21" />
      <circle cx="14" cy="4" r="9.5" />
      <path d="M-8 38h16v19h-16z" />
      <path d="M-9 54C-26 57-38 69-41 93l-4 119h90l-4-119c-3-24-15-36-32-39z" />
      <path d="M28 76 46 26 42-14" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="31" y="-46" width="22" height="34" rx="4" />
    </g>
    <g id="ihype-c-p3"><!-- long hair, arms down -->
      <path d="M-28 60c-6-30 2-54 28-54s34 24 28 54c-2 10-9 12-16 12h-24c-7 0-14-2-16-12z" />
      <ellipse cx="0" cy="28" rx="17" ry="20" />
      <path d="M-8 42h16v18h-16z" />
      <path d="M-9 57C-28 60-41 73-44 97l-4 115h96l-4-115c-3-24-16-37-35-40z" />
    </g>
    <g id="ihype-c-p4"><!-- cap, one arm up -->
      <ellipse cx="0" cy="27" rx="18" ry="21" />
      <path d="M-19 20C-19 5-11-4 0-4s19 9 19 24l18 5H-19z" />
      <path d="M-8 40h16v19h-16z" />
      <path d="M-9 56C-27 59-39 72-42 96l-4 116h92l-4-116c-3-24-15-37-33-40z" />
      <path d="M-29 76-50 32-44-12" stroke-width="12.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-44" cy="-19" r="8" />
    </g>
    <g id="ihype-c-p5"><!-- curls, both hands up, slimmer -->
      <circle cx="0" cy="26" r="20" />
      <circle cx="-16" cy="14" r="10.5" /><circle cx="16" cy="14" r="10.5" /><circle cx="0" cy="6" r="11.5" />
      <path d="M-8 42h16v18h-16z" />
      <path d="M-9 56C-26 59-37 71-40 95l-4 117h88l-4-117c-3-24-14-36-31-39z" />
      <path d="M-28 76-46 32-54-8" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-54" cy="-15" r="8" />
      <path d="M28 76 46 32 54-8" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="54" cy="-15" r="8" />
    </g>
  </defs>

  <g clip-path="url(#ihype-c-clip)">
    <rect width="512" height="512" fill="url(#ihype-c-tile)" />
    <rect width="512" height="512" fill="url(#ihype-c-stage)" />

    <g fill="#ff5029" stroke="#ff5029" stroke-width="0" opacity=".38">
      <use href="#ihype-c-p3" transform="translate(-6 360) scale(.72)" />
      <use href="#ihype-c-p1" transform="translate(62 350) scale(.72)" />
      <use href="#ihype-c-p5" transform="translate(130 364) scale(.72)" />
      <use href="#ihype-c-p2" transform="translate(198 352) scale(.72)" />
      <use href="#ihype-c-p4" transform="translate(266 362) scale(.72)" />
      <use href="#ihype-c-p3" transform="translate(334 350) scale(.72)" />
      <use href="#ihype-c-p1" transform="translate(402 364) scale(.72)" />
      <use href="#ihype-c-p4" transform="translate(470 354) scale(.72)" />
    </g>

    <g fill="#ff5029" stroke="#ff5029" stroke-width="0">
      <use href="#ihype-c-p1" transform="translate(8 396) scale(1.05)" />
      <use href="#ihype-c-p3" transform="translate(92 410) scale(1.05)" />
      <use href="#ihype-c-p2" transform="translate(176 392) scale(1.05)" />
      <use href="#ihype-c-p4" transform="translate(260 406) scale(1.05)" />
      <use href="#ihype-c-p5" transform="translate(344 394) scale(1.05)" />
      <use href="#ihype-c-p3" transform="translate(428 408) scale(1.05)" />
      <use href="#ihype-c-p1" transform="translate(508 396) scale(1.05)" />
    </g>

    <!-- Wordmark: the same 100-unit drawing as the full mark, scaled to 360. -->
    <g transform="translate(76 96) scale(.963)">
      <g fill="#ff5029">
        <rect width="24" height="20" rx="4" />
        <rect y="28" width="24" height="72" rx="3" />
      </g>
      <g fill="#f0ebe5">
        <rect x="36" width="24" height="100" rx="3" />
        <rect x="96" width="24" height="100" rx="3" />
        <rect x="36" y="38" width="84" height="22" />
        <path d="M132 0h26l13 32 13-32h26l-27 62v38h-24v-38z" />
        <path fill-rule="evenodd" d="M222 0h36c22 0 38 12 38 29s-16 29-38 29h-12v42h-24zm24 20v18h12c8 0 13-4 13-9s-5-9-13-9z" />
        <rect x="308" width="24" height="100" rx="3" />
        <rect x="308" width="66" height="24" rx="3" />
        <rect x="308" y="38" width="58" height="22" />
        <rect x="308" y="76" width="66" height="24" rx="3" />
      </g>
    </g>

    <!-- | LOCAL MUSIC | knocked out of the accent bar. The letters are stroked
         in the tile colour over the bar rather than masked out of it - same
         result, one fewer paint server to resolve in a favicon context. -->
    <rect x="56" y="214" width="400" height="78" rx="16" fill="#ff5029" />
    <g transform="translate(66 235) scale(1.044)" fill="none" stroke="#0a0805" stroke-width="7" stroke-linecap="square">
      <path d="M3.5-2V32" />
      <path d="M26.5 0v26.5H43" />
      <rect x="52.5" y="3.5" width="23" height="23" rx="11.5" />
      <path d="M108 7a11.5 11.5 0 1 0 0 16" />
      <path d="M120.5 28 130 2l9.5 26M123 20h14" />
      <path d="M152.5 0v26.5H169" />
      <path d="M196.5 30V3l13.5 17L223.5 3v27" />
      <path d="M236.5 0v13a12.5 12.5 0 0 0 25 0V0" />
      <path d="M292 8c0-5-6-7.5-10.5-7.5S274 4 274 8s4 6.5 9 7c5 .5 9 3 9 7s-5 7.5-10 7.5S273 27 272 24" />
      <path d="M304.5 0v30" />
      <path d="M337 7a11.5 11.5 0 1 0 0 16" />
      <path d="M360-2V32" />
    </g>

    <rect class="ihype-tile-edge" x=".75" y=".75" width="510.5" height="510.5" rx="111.25" fill="none" stroke="#f0ebe5" stroke-opacity=".14" stroke-width="1.5" />
  </g>
</svg>
