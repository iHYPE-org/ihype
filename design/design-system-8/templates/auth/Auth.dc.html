<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="iHYPE Auth" description="Auth screens — Sign in, Register, Magic-link sent, Invite landing. Pick via `mode` tweak. Grounded in src/components/AuthScreens.tsx usage." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="../../lib/theme.js"></script>
<script src="../../lib/theme-toggle.js"></script>
<script src="../../lib/i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}button{transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s ease,filter .16s ease}button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}a{transition:filter .16s ease,transform .16s ease}@keyframes ihFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}body>div{animation:ihFadeUp .5s cubic-bezier(.16,1,.3,1) both}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}body{background:radial-gradient(1100px 560px at 50% -12%,rgba(255,80,41,.09),transparent 62%),var(--bg-base);color:var(--ink-1);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}a{color:var(--accent);text-decoration:none}
@keyframes auIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes auPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:radial-gradient(circle at 50% 0%,#1f0e07,var(--bg-base) 60%)">
  <div style="width:100%;max-width:400px;animation:auIn .6s cubic-bezier(.16,1,.3,1) both">
    <div style="text-align:center;margin-bottom:30px">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2rem;letter-spacing:-.05em;color:var(--accent)">iHYPE</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin-top:6px">{{ tagline }}</div>
    </div>

    <div style="background:rgba(var(--surface-tint-rgb),.04);backdrop-filter:blur(24px);border:1px solid rgba(var(--surface-tint-rgb),.16);border-radius:18px;padding:30px 28px">
      <sc-if value="{{ isInvite }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;margin-bottom:22px">
          <div style="width:52px;height:52px;border-radius:50%;background:rgba(255,80,41,.12);border:1px solid rgba(255,80,41,.35);display:grid;place-items:center;margin:0 auto 14px;font-size:1.3rem;animation:auPulse 2.4s infinite">🎟️</div>
          <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.02em">{{ inviteHeading }}</div>
          <div style="font-size:.86rem;color:var(--ink-2);margin-top:6px;line-height:1.55">{{ inviteBody }} <span style="font-family:'JetBrains Mono',monospace;color:#ffb84a">GLASSLIGHT</span></div>
        </div>
      </sc-if>
      <sc-if value="{{ isMagic }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center">
          <div style="width:52px;height:52px;border-radius:50%;background:rgba(34,229,212,.1);border:1px solid rgba(34,229,212,.35);display:grid;place-items:center;margin:0 auto 16px;font-size:1.3rem">✉️</div>
          <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;margin-bottom:8px">{{ checkEmail }}</h1>
          <p style="font-size:.88rem;color:var(--ink-2);line-height:1.6">{{ magicBody }} <b style="color:var(--ink-1)">jess@example.com</b>. {{ magicExpiry }}</p>
          <button style="margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.08em;background:transparent;border:none;color:var(--ink-2);cursor:pointer;text-decoration:underline">{{ resendLink }}</button>
          <a href="../role-onboarding/RoleOnboarding.dc.html" style="display:block;margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.06em;color:var(--accent)">{{ simulateLink }}</a>
        </div>
      </sc-if>
      <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{ showHeading }}">
          <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;margin-bottom:4px">{{ heading }}</h1>
          <p style="font-size:.86rem;color:var(--ink-2);margin-bottom:22px;line-height:1.55">{{ subheading }}</p>
        </sc-if>
        <label style="display:block;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:18px">{{ emailLabel }}<input placeholder="you@example.com" type="email" style="display:block;width:100%;margin-top:7px;background:var(--bg-base);border:1px solid rgba(var(--surface-tint-rgb),.12);border-radius:10px;padding:13px 14px;color:var(--ink-1);font-family:'Work Sans',sans-serif;font-size:.92rem;outline:none"></input></label>
        <sc-if value="{{ loading }}"><button disabled style="width:100%;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.94rem;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:999px;cursor:pointer;box-shadow:0 6px 24px rgba(255,80,41,.3);opacity:.6">{{ cta }}</button></sc-if>
        <sc-if value="{{ notLoading }}"><button onClick="{{ submit }}" style="width:100%;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:.94rem;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:999px;cursor:pointer;box-shadow:0 6px 24px rgba(255,80,41,.3)">{{ cta }}</button></sc-if>
        <div style="font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--ink-3);text-align:center;margin-top:14px;line-height:1.7">{{ noPasswords }}</div>
      </sc-if>
    </div>

    <div style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--ink-4);margin-top:24px;letter-spacing:.08em">70/20/10 · iHYPE fee $0 · <a href="../charter/Charter.dc.html" style="color:var(--ink-3)">The charter</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;480px&quot;,&quot;height&quot;:&quot;640px&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;'start'|'magic'|'invite'&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;magic&quot;,&quot;invite&quot;],&quot;section&quot;:&quot;Screen&quot;}}">
class Component extends DCLogic {
  state = { mode: null, loading: false, lang: 0 };
  componentDidMount() {
    this._li18n = () => this.forceUpdate();
    window.addEventListener('ihype-i18n-change', this._li18n);
  }
  componentWillUnmount() { window.removeEventListener('ihype-i18n-change', this._li18n); }
  renderVals() {
    const t = window.ihypeT ? (k, f) => { const v = window.ihypeT(k); return v === k ? f : v; } : (k, f) => f;
    const mode = this.state.mode ?? this.props.mode ?? 'start';
    const loading = this.state.loading;
    return {
      tagline: 'Artist-owned live music',
      inviteHeading: t('auInviteHeading', 'Nyla invited you'),
      inviteBody: t('auInviteBody', "You've been invited to iHYPE early access with code"),
      checkEmail: t('auCheckEmail', 'Check your email'),
      magicBody: t('auMagicBody', 'We sent a sign-in link to'),
      magicExpiry: t('auMagicExpiry', 'It works once and expires in 15 minutes.'),
      resendLink: t('auResendLink', 'Resend link'),
      simulateLink: t('auSimulateLink', 'Simulate clicking the link → continue setup'),
      emailLabel: t('auEmailLabel', 'Email'),
      noPasswords: t('auNoPasswords', 'No passwords — we email you a one-time sign-in link.'),
      isInvite: mode === 'invite',
      isMagic: mode === 'magic',
      showForm: mode !== 'magic',
      showHeading: mode !== 'invite',
      heading: mode === 'invite' ? t('auClaimSpot', 'Claim your spot') : t('auContinue', 'Continue with email'),
      subheading: mode === 'invite'
        ? t('auInviteSub', 'Create your account to accept the invite — free, no card required.')
        : t('auStartSub', 'One field. New or returning, the link signs you in either way.'),
      cta: loading ? t('auSending', 'Sending link…') : t('auEmailMe', 'Email me a sign-in link →'),
      loading, notLoading: !loading,
      submit: () => { this.setState({ loading: true }); setTimeout(() => this.setState({ mode: 'magic', loading: false }), 650); },
    };
  }
}
</script>
</body>
</html>
