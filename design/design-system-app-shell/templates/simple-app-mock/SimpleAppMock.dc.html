<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<!-- @template name="iHYPE App Mock (live)" description="The simplified iHYPE app running live in phone and desktop frames, side by side." -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./ds-base.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0805}::-webkit-scrollbar{width:0;height:0}#ihypeThemeToggle{display:none!important}@keyframes ih-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}</style>
</helmet>
<div style="font-family:'DM Sans',system-ui,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#17110c,#0a0805 62%);color:#f0ebe5;min-height:100vh;padding:44px 40px 56px">
<div style="max-width:1560px;margin:0 auto">
<div style="display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:8px">
<div style="font-family:'Syne',sans-serif;font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1">iHYPE, live</div>
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,235,229,.4);padding-bottom:7px">Both frames are the real app · fully interactive</div>
</div>
<div style="font-size:15px;color:rgba(240,235,229,.58);line-height:1.7;max-width:760px;margin-bottom:34px">Tap the iHYPE logo in either frame to fan out MAP · MUSIC · ME. Swipe the seed card left to skip, right to save. Double-tap the logo for search. Light mode lives in ME → Settings → Appearance.</div>
<div style="display:grid;grid-template-columns:minmax(880px,1fr) 418px;gap:40px;align-items:start;min-width:1338px">

<div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,235,229,.4)">Desktop</div>
<div style="flex:1;height:1px;background:rgba(255,255,255,.07)"></div>
</div>
<div style="border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#100d09;animation:ih-rise .4s both">
<div style="display:flex;align-items:center;gap:9px;padding:12px 16px;background:#171310;border-bottom:1px solid rgba(255,255,255,.07)">
<div style="width:11px;height:11px;border-radius:9999px;background:#ff5f57"></div>
<div style="width:11px;height:11px;border-radius:9999px;background:#febc2e"></div>
<div style="width:11px;height:11px;border-radius:9999px;background:#28c840"></div>
<div style="flex:1;display:flex;justify-content:center">
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:rgba(240,235,229,.42);background:#0a0805;border-radius:9999px;padding:5px 18px">ihype.org/app</div>
</div>
</div>
<iframe src="../simple-app/SimpleApp.dc.html" title="iHYPE app — desktop" style="display:block;width:100%;height:min(84vh,860px);min-height:720px;border:none;background:#0a0805"></iframe>
</div>
</div>

<div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,235,229,.4)">Phone</div>
<div style="flex:1;height:1px;background:rgba(255,255,255,.07)"></div>
</div>
<div style="width:418px;padding:13px;border-radius:56px;background:linear-gradient(160deg,#2b2521,#111 62%);box-shadow:0 30px 80px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.14);animation:ih-rise .5s both">
<div style="position:relative;border-radius:44px;overflow:hidden;background:#0a0805;height:800px">
<div style="position:absolute;left:0;right:0;top:0;height:46px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;color:#f0ebe5;pointer-events:none">
<div>9:41</div>
<div style="position:absolute;left:50%;top:9px;transform:translateX(-50%);width:104px;height:28px;border-radius:9999px;background:#000"></div>
<div style="display:flex;gap:6px;align-items:center"><div>5G</div><div style="width:22px;height:11px;border:1px solid rgba(240,235,229,.6);border-radius:3px;padding:1px"><div style="width:72%;height:100%;background:#f0ebe5;border-radius:1px"></div></div></div>
</div>
<iframe src="../simple-app/SimpleApp.dc.html" title="iHYPE app — phone" style="display:block;width:456px;height:930px;border:none;background:#0a0805;transform:scale(.86);transform-origin:top left"></iframe>
</div>
</div>
</div>

</div>
</div>
</div>
</x-dc>
