<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<!-- @template name="iHYPE Sitemap" description="Internal navigation hub — every real route grouped by section, for QA/testers to find any page fast." -->
<helmet>
  <script src="./ds-base.js"></script>
<script src="../../lib/theme.js"></script>
<script src="../../lib/theme-toggle.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}button{transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s ease,filter .16s ease}button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}a{transition:filter .16s ease,transform .16s ease}@keyframes ihFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}body>div{animation:ihFadeUp .5s cubic-bezier(.16,1,.3,1) both}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}body{background:radial-gradient(1100px 560px at 50% -12%,rgba(255,80,41,.09),transparent 62%),var(--bg-base);color:var(--ink-1);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}</style>
</helmet>

<div style="max-width:1040px;margin:0 auto;padding:56px 28px 100px">
  <p style="font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Internal · QA use only</p>
  <h1 style="font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.8rem,5vw,2.4rem);letter-spacing:-.03em;margin-bottom:8px">Sitemap</h1>
  <p style="font-size:.9rem;color:var(--ink-2);margin-bottom:36px">Every live route on ihype.org, grouped by section.</p>

  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="7">
    <div style="margin-bottom:32px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px">{{ g.label }}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px">
        <sc-for list="{{ g.routes }}" as="r" hint-placeholder-count="4">
          <a href="{{ r.href }}" style="display:block;padding:14px 16px;border:1px solid rgba(var(--surface-tint-rgb),.15);border-radius:10px;background:rgba(var(--surface-tint-rgb),.04);backdrop-filter:blur(24px)">
            <div style="font-weight:700;font-size:.88rem;margin-bottom:3px">{{ r.name }}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--ink-3)">{{ r.path }}</div>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { label: 'Marketing / Public', routes: [
          ['Home', '/', '../landing/Landing.dc.html'], ['About (hub: Charter/Press/Transparency/Trust/Legal)', '/about', '../about/About.dc.html'],
          ['Launch', '/launch', '../beta-launch-deck/BetaLaunchDeck.dc.html'], ['Advertise', '/advertise', '../advertise/Advertise.dc.html'],
          ['Artist Kit', '/artists/apply', '../artist-kit/ArtistKit.dc.html'], ['DJ Kit', '/djs/apply', '../dj-kit/DJKit.dc.html'], ['Venue Kit', '/venues/apply', '../venue-kit/VenueKit.dc.html'], ['Fan Kit', '/fans/join', '../fan-kit/FanKit.dc.html'],
          ['Press Kit', '/press', '../press-kit/PressKit.dc.html'], ['Product brief', '/internal/brief', '../product-brief/ProductBrief.dc.html'],
        ]},
        { label: 'About hub (Charter · Press · Transparency · Trust · Legal)', routes: [
          ['About', '/about', '../about/About.dc.html'], ['Charter', '/about?tab=charter', '../charter/Charter.dc.html'], ['Press Kit', '/about?tab=press', '../press-kit/PressKit.dc.html'], ['Transparency', '/about?tab=transparency', '../transparency/Transparency.dc.html'],
          ['Trust & Safety', '/about?tab=trust', '../trust-policy/TrustPolicy.dc.html'], ['Legal', '/about?tab=legal', '../legal/Legal.dc.html'], ['Trust & safety report', '/trust/audit', '../audit/Audit.dc.html'],
        ]},
        { label: 'Legal (tabbed section)', routes: [
          ['Privacy', '/legal?tab=privacy', '../legal/Legal.dc.html'], ['Terms', '/legal?tab=terms', '../legal/Legal.dc.html'],
          ['Charter', '/legal?tab=charter', '../charter/Charter.dc.html'], ['DMCA', '/legal?tab=dmca', '../legal/Legal.dc.html'],
        ]},
        { label: 'Auth & Onboarding', routes: [
          ['Sign in', '/login', '../auth/Auth.dc.html'], ['Register', '/register', '../auth/Auth.dc.html'], ['Welcome', '/welcome', '../welcome/Welcome.dc.html'],
          ['Verify', '/verify', '../verify/Verify.dc.html'], ['Invite landing', '/invite/[code]', '../auth/Auth.dc.html'],
        ]},
        { label: 'Fan product', routes: [
          ['Listen', '/listen', '../fan-app/FanApp.dc.html'], ['Discover', '/discover', '../discover/Discover.dc.html'], ['Search', '/search', '../fan-app/FanApp.dc.html'],
          ['My Dashboard (+ Notifications tab)', '/me/dashboard', '../role-dashboard/RoleDashboard.dc.html'], ['Tickets', '/tickets', '../support-tickets/SupportTickets.dc.html'], ['Settings', '/settings', '../role-settings/RoleSettings.dc.html'],
        ]},
        { label: 'Events', routes: [
          ['Shows', '/shows', '../discover/Discover.dc.html'], ['Show detail', '/shows/[slug]', '../show-detail/ShowDetail.dc.html'], ['This weekend', '/this-weekend', '../discover/Discover.dc.html'],
          ['Publish a show', '/events/new', '../event-create/EventCreate.dc.html'], ['Payouts', '/me/payouts', '../payouts/Payouts.dc.html'], ['Lineup & split', '/shows/[slug]/lineup', '../lineup-split/LineupSplit.dc.html'],
        ]},
        { label: 'Creator / Artist / DJ', routes: [
          ['Artist profile', '/artists/[slug]', '../profile-page/ProfilePage.dc.html'], ['Artist dashboard', '/artists/[slug]/dashboard', '../role-dashboard/RoleDashboard.dc.html'],
          ['Artist analytics', '/artists/[slug]/analytics', '../role-dashboard/RoleDashboard.dc.html'], ['Artist onboarding', '/artists/[slug]/onboarding', '../role-onboarding/RoleOnboarding.dc.html'],
          ['DJ profile', '/promoters/[slug]', '../profile-page/ProfilePage.dc.html'], ['DJ dashboard', '/promoters/[slug]/dashboard', '../role-dashboard/RoleDashboard.dc.html'],
          ['Track detail', '/tracks/[hexId]', '../track-detail/TrackDetail.dc.html'], ['Radio', '/radio', '../fan-app/FanApp.dc.html'], ['Pages', '/pages', '../fan-app/FanApp.dc.html'], ['AI Page Creator', '/pages/create', '../page-creator/PageCreator.dc.html'],
        ]},
        { label: 'Venue & Promoter', routes: [
          ['Venue profile', '/venues/[slug]', '../profile-page/ProfilePage.dc.html'], ['Venue dashboard', '/venues/[slug]/dashboard', '../role-dashboard/RoleDashboard.dc.html'],
          ['Booking inbox', '/venues/[slug]/booking-inbox', '../booking-inbox/BookingInbox.dc.html'], ['Promoting (fan\u2019s built-in view)', '/me/dashboard?tab=promoting', '../role-dashboard/RoleDashboard.dc.html'],
          ['Payouts (History · Settings · This show)', '/me/payouts', '../payouts/Payouts.dc.html'],
        ]},
        { label: 'Support & Admin', routes: [
          ['Support hub (tickets + status)', '/support', '../site-pages/SitePages.dc.html'], ['My tickets', '/support/tickets', '../support-tickets/SupportTickets.dc.html'], ['Status', '/status', '../status/Status.dc.html'],
          ['Admin', '/admin', '../ops-console/OpsConsole.dc.html'], ['Advertiser signup', '/advertise/register', '../advertiser-signup/AdvertiserSignup.dc.html'], ['Cancel a show', '/shows/[slug]/cancel', '../event-cancel/EventCancel.dc.html'],
        ]},
        { label: 'Design & Internal', routes: [
          ['Social image kit', '/internal/social', '../social/Social.dc.html'], ['App Store kit', '/internal/app-store', '../app-store-kit/AppStoreKit.dc.html'], ['Notification designs', '/internal/notifs', '../notif-designs/NotifDesigns.dc.html'],
          ['Workbench', '/internal/workbench', '../workbench/Workbench.dc.html'], ['Workbench screen scaffold', '/internal/workbench-screen', '../workbench-screen/WorkbenchScreen.dc.html'],
          ['iOS app shell', '/internal/ios', '../ios-app/IosApp.dc.html'], ['Android app shell', '/internal/android', '../android-app/AndroidApp.dc.html'], ['Android screen scaffold', '/internal/android-screen', '../android-screen/AndroidScreen.dc.html'],
          ['Transactional email', '/internal/email', '../email/Email.dc.html'], ['This sitemap', '/sitemap', '#'],
        ]},
      ].map(g => ({ label: g.label, routes: g.routes.map(([name, path, href]) => ({ name, path, href })) })),
    };
  }
}

</script>
</body>
</html>
