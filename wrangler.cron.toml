name = "ihype-cron"
compatibility_date = "2026-07-30"
main = "workers/cron.ts"

[build]
command = ""

[vars]
APP_BASE_URL = "https://ihype.org"

[observability]
enabled = true
head_sampling_rate = 1

# CRON_SECRET must be set as a secret:
#   wrangler secret put CRON_SECRET --config wrangler.cron.toml
#
# HEARTBEAT_URL is optional but strongly recommended — it is the only alarm
# that lives outside this system. Create a check on any dead-man's-switch
# service (Healthchecks.io has a free tier), set its expected period to
# 10 minutes and its grace to 10, then:
#   wrangler secret put HEARTBEAT_URL --config wrangler.cron.toml
# See docs/monitoring.md.

[triggers]
crons = [
  "*/5 * * * *",  # show-lifecycle, expire-reservations
  "0 */6 * * *",  # health-check, db-health, stripe-connect-health
  "0 1 * * *",    # close-stale-bookings
  "0 3 * * *",    # session-cleanup, push-cleanup, identity-detach (30-day IP scrub)
  "0 4 * * 1",    # audit-log-rotate (Monday)
  "0 6 * * *",    # feature-shows
  "0 8 * * *",    # digest
  "0 9 * * 1",    # weekly-picks, artist-digest, admin-report, follow-digest (Monday)
  "0 10 * * *",   # new-to-scene
  "0 11 * * *",   # artist-onboarding
  "0 12 * * *",   # show-reminders, workbench-digest, held-track-notice
  "0 13 * * *",   # show-payouts, ad-settlement
  "0 14 * * *",   # onboarding
  "0 15 * * *",   # welcome-sequence
  "0 5 * * *",    # backup-verify
  "0 7 * * *",    # daily-ops
  "0 * * * *",    # anomaly-check (every hour)
  "30 3 * * *",   # dmca-enforce
  "30 8 * * 1",   # social-digest (Monday)
  "*/15 * * * *", # publish-scheduled (every 15min)
  "0 16 * * *",   # post-show-recap (morning-after recap for attendees)
  # This slot used to be a NOTE reading 'nearby-show-notify runs at "0 9 * * *"
  # (already covered by daily 9am slot)'. There was no daily 9am slot: the two
  # nine-o'clock entries are "0 9 * * 1" (Monday) and "0 9 1 * *" (the 1st).
  # The dispatcher matches `job.schedule === event.cron` EXACTLY, so the job
  # never once fired — fans were never told about a show near them. A test now
  # asserts every dispatcher schedule appears here, because the thing that hid
  # this was a comment claiming coverage rather than a check measuring it.
  "0 9 * * *",    # nearby-show-notify
  # NOTE: rsvp-reminders runs at "0 * * * *" (already covered by hourly slot)
  # NOTE: capacity-alerts runs at "0 * * * *" (already covered by hourly slot)
  # NOTE: weekly-digest runs at "0 9 * * 1" (already covered by Monday 9am slot)
  "0 9 1 * *",  # artist-earnings-summary (1st of month)
]
