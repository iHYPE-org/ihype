name: CodeQL security analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-analysis:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38
        with:
          category: /language:${{ matrix.language }}
          # Keep a short-lived private source-to-sink trace for CodeQL alert
          # triage when the code-scanning API is unavailable to the app.
          output: codeql-sarif-diagnostics
      - name: Save JS/TS CodeQL traces for authorized security triage
        if: ${{ matrix.language == 'javascript-typescript' && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-js-ts-sarif
          path: codeql-sarif-diagnostics/
          if-no-files-found: error
          retention-days: 1
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38
        with:
          languages: swift
          build-mode: manual
      - name: Build iOS for analysis
        working-directory: ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug clean build CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@38112626f97ac1fd7acf3df7ebca51f4677c1b38
        with:
          category: /language:swift
