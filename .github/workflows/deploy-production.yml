name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  # Manual recovery. A deploy run that GitHub never CREATED cannot be
  # re-run — and that happens: on 2026-08-26 the Actions budget was
  # exhausted mid-session, so the push that merged #765 produced no deploy
  # run at all (no failure, no notice; only the unbilled Pages job
  # appeared). Without this the only way to ship the already-merged commit
  # is to invent another push to `main`, which means an empty or throwaway
  # commit in the production history to work around a billing event.
  #
  # Guarded to `main` in the job below: this workflow runs
  # `prisma migrate deploy` against the PRODUCTION database, so dispatching
  # it on a feature branch would apply that branch's migrations to
  # production — a far worse outcome than the missed deploy it recovers.
  workflow_dispatch:

concurrency:
  group: production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    # `main` only, however this was started. See the workflow_dispatch note
    # above: the migrate step targets the production database.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production – ihype
    permissions:
      contents: read
      deployments: write
    services:
      # Local-only scratch DB for the pre-deploy Workerd smoke test below —
      # never touches the real production database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ihype
          POSTGRES_PASSWORD: ihype
          POSTGRES_DB: ihype
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ihype"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deployment credentials are missing; production deployment cannot be skipped."
            exit 1
          fi

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Source policy lint
        run: npm run lint

      - name: Design guard
        run: npm run guard:design

      - name: Run tests
        run: npm test

      - name: Build for Cloudflare Workers
        run: npm run cf:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_BASE_URL: https://ihype.org
          NEXT_PUBLIC_APP_URL: https://ihype.org
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADSF8WNxaeBIRmR7"
          FEATURE_ENABLE_TICKET_PAYMENTS: 'true'

      # Safety net for the 2026-07-21 incident (see scripts/worker-size-budget.mjs):
      # this same check runs in ci.yml on every PR, but branch protection
      # doesn't yet block merges on that check passing, so this catches it
      # here too, before spending time on the smoke test/migrations that
      # would otherwise precede a doomed deploy.
      - name: Worker bundle size budget
        run: node scripts/worker-size-budget.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare Workerd smoke scratch database
        run: |
          psql "postgresql://ihype:ihype@localhost:55432/ihype" -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS citext;'
          npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype

      - name: Pre-deploy Workerd smoke test
        # Boots the just-built worker.js under REAL workerd (wrangler dev) and
        # exercises it before touching production migrations or Cloudflare —
        # a build/typecheck/vitest pass proves nothing about workerd-only
        # crashes (2026-07-20: @sentry/nextjs's server init took production
        # down with an AsyncLocalStorage error that only ever surfaced here).
        # This is the same script ci.yml already runs on every PR — running
        # it again here means a deploy can't reach Cloudflare even if a PR
        # was merged before its own CI check finished (exactly what happened
        # that day). Runs against the local scratch DB above only; never
        # touches the real production database.
        timeout-minutes: 20
        run: |
          set -o pipefail
          SKIP_LIGHTHOUSE_BUDGET=1 node scripts/workerd-smoke.mjs 2>&1 | tee workerd-smoke.log
        env:
          DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_CRON_SECRET: predeploy-workerd-health-secret-0123456789
          AUTH_SECRET: predeploy-only-auth-secret-change-me-0123456789
          NEXTAUTH_SECRET: predeploy-only-auth-secret-change-me-0123456789

      - name: Upload pre-deploy Workerd smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: predeploy-workerd-smoke-log
          path: workerd-smoke.log
          if-no-files-found: ignore

      - name: Gated migration guard
        # Last line of defence before production schema changes. Everything in
        # prisma/migrations/ is applied by the step below the moment it reaches
        # main, so a migration still carrying a gate marker must stop the
        # deploy here rather than ship. See prisma/migrations-pending/README.md.
        run: npm run guard:migrations

      - name: Run migrations
        # Build (and now the Workerd smoke test above) run first so neither a
        # compilation failure nor a workerd-only crash can advance production
        # schema. Prisma reads DATABASE_URL, so supply the direct/non-pooled
        # secret under that exact name for migration commands.
        run: |
          for i in 1 2 3; do
            set +e
            out=$(npx prisma migrate deploy 2>&1)
            code=$?
            set -e
            echo "$out"
            [ $code -eq 0 ] && exit 0

            # P3009 means a row in _prisma_migrations has finished_at = NULL.
            # That is a permanent state, not a flaky connection: retrying it
            # burns 45s and then reports a generic failure that says nothing
            # about the actual remedy. Stop immediately and name the fix.
            # This blocks the Cloudflare deploy too, since every step below
            # is skipped when this one fails -- so production stops shipping
            # entirely until someone resolves it.
            if echo "$out" | grep -q 'P3009'; then
              name=$(echo "$out" | sed -n 's/.*The `\([^`]*\)` migration started at.*/\1/p' | head -1)
              echo "::error::P3009: a previously failed migration is blocking every deploy${name:+ (}${name}${name:+)}. Confirm whether its DDL is already in the database, then run the 'Resolve a failed migration' workflow (Actions tab) with that name. See scripts/resolve-failed-migration.mjs."
              exit 1
            fi

            echo "Migration attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "::error::prisma migrate deploy failed; blocking deploy."
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy worker.js --autoconfig=false
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_BASE_URL: https://ihype.org
          NEXT_PUBLIC_APP_URL: https://ihype.org
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADSF8WNxaeBIRmR7"
          FEATURE_ENABLE_TICKET_PAYMENTS: 'true'

      - name: Verify cron Worker secrets
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list --config wrangler.cron.toml)"
          for required in CRON_SECRET HEARTBEAT_URL; do
            if ! echo "$secrets" | jq -e --arg name "$required" 'any(.[]; .name == $name)' >/dev/null; then
              echo "::error::The ihype-cron Worker is missing required secret $required."
              exit 1
            fi
          done

      - name: Deploy cron Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy --config wrangler.cron.toml

      - name: Smoke production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run smoke:production
        env:
          SMOKE_BASE_URL: https://ihype.org
          SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}
          SMOKE_HEALTH_BEARER: ${{ secrets.CRON_SECRET }}
          SMOKE_RELAY_URL: https://ihype-cron.colinatwood.workers.dev/smoke
          SMOKE_REQUIRE_LAUNCH_READY: '1'

      - name: Install Playwright browser for the phone-fit measurement
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        # Nothing else in this workflow drives a browser — the pre-deploy smoke
        # runs workerd and talks HTTP — so the browser has to be fetched here.
        # `--with-deps chromium` only, not every engine: this measures one
        # viewport in one browser.
        continue-on-error: true
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers

      - name: Phone fit against production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        # `audit:mobile` measures rendered boxes at 393x852 — a control too
        # small to hit is invisible to every static check in this repo, and iOS
        # and Android render these same stylesheets through a WebView, so a
        # phone-fit regression is a CSS regression that ships to both stores
        # with no review.
        #
        # It runs HERE rather than in CI, and the reason is the base URL: its
        # budgets are ratchets measured against production, and CI has no
        # production to measure. It is also deliberately NOT a gate on the
        # deploy — it runs after the site is live, reports, and does not fail
        # the run. `--strict` would make a browser flake look like a broken
        # deploy, and the deploy has already happened by this point.
        continue-on-error: true
        run: npm run audit:mobile -- --base=https://ihype.org
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers

      - name: Purge Cloudflare cache
        if: env.CLOUDFLARE_CACHE_PURGE_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != ''
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /tmp/purge-result.json
          if ! grep -q '"success":true' /tmp/purge-result.json; then
            echo "Cache purge failed:" && cat /tmp/purge-result.json && exit 1
          fi
          echo "Cache purged successfully."

      - name: Skip Cloudflare deploy notice
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
