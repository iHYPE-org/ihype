name: Auto-label full-ci

# The browser, Workerd and Lighthouse stages are gated behind the `full-ci`
# label because they are ~11 of CI's ~15 minutes and the org's Actions
# allowance could not pay for them on every push. That trade is sound. What is
# not sound is that applying the label is a thing a human has to remember, on
# exactly the changes where forgetting is most expensive: every regression
# caught by those stages recently — a date strip overlapping the map's layer
# chips, a permission sheet covering the nav, a tab strip running 35px off a
# 390px phone — was invisible to typecheck, lint, 736 unit tests and both
# audits.
#
# So the label is applied by the diff instead of by memory. Cost is unchanged
# for a change that touches none of these paths; a change that touches the
# shell, routing, the service worker or anything Workerd-specific gets the
# stages that cover it, whether or not anyone thought to ask.
#
# Applying a label re-triggers CI: `labeled` is in the CI workflow's own
# trigger types (PR #652 — before that, labelling fired no new run and the
# original run had carried an empty label list, so the gated steps skipped
# while still reporting success).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply full-ci when the diff needs it
    runs-on: ubuntu-latest
    # A PR that already carries the label needs nothing: re-adding it is a
    # no-op that would still cost a job.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide from the changed paths
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"; echo "$changed"

          # What each pattern buys, so the list can be argued with rather than
          # cargo-culted:
          #   *.css                     — layout and geometry; only a browser sees it
          #   components/shell, app/app — the two shells' chrome contracts
          #   components/mmm            — the map, the panes, the player
          #   lib/*nav*, app-nav        — the route registries both shells read
          #   middleware.ts             — auth redirects and CSP, Edge-runtime only
          #   public/sw.js              — caching, and it can serve a stale app
          #   e2e/                      — the tests themselves
          #   layout.tsx                — metadata, manifest, viewport, providers
          if echo "$changed" | grep -qE '(\.css$|^src/components/shell/|^src/components/mmm/|^src/app/app/|^src/lib/(app-nav|mmm-nav)\.ts$|^middleware\.ts$|^public/sw\.js$|^e2e/|^src/app/layout\.tsx$)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the label
        if: steps.decide.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$NUMBER/labels" \
            -d '{"labels":["full-ci"]}' > /dev/null
          echo "Applied full-ci — this diff touches the shell, routing, styling or the service worker."
