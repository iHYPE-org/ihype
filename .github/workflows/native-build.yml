name: Native shell build (iOS + Android)

# iHYPE ships as a Capacitor shell around the live site (capacitor.config.ts
# points server.url at production), so this workflow only needs to run when
# the native shell itself changes — icons, splash, native config, plugins.
# Regular feature/content work ships through deploy-production.yml and
# reaches every platform immediately with no rebuild here.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'capacitor-shell/**'
      - 'package.json'
      # THE WORKFLOW TESTS ITSELF. Without this line a change to this file
      # triggers nothing, so an edit to the release plumbing reaches main with
      # no signal at all — which is exactly how an invalid expression got in
      # on 2026-09-04 and left the whole workflow unable to parse. The only
      # reason anyone noticed is that GitHub manufactures a startup-failure
      # run for an unparseable file regardless of triggers, and even that
      # reported `event: push` on a workflow that has no push trigger.
      - '.github/workflows/native-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload successful signed builds to TestFlight and Play internal testing'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Debug/simulator builds need no signing, so this runs unconditionally as
  # a real "does the native shell still compile" check on every change.
  ios-debug-build:
    name: iOS — debug build (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync ios

      # Capacitor 8's iOS template uses a local Swift Package (CapApp-SPM)
      # for plugin dependencies instead of CocoaPods, so there's no Podfile
      # and no .xcworkspace — xcodebuild resolves the local package itself.
      - name: Build for iOS Simulator (no signing required)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

  android-debug-build:
    name: Android — debug build (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  # Signed release builds need an Apple Developer Program account and a
  # Google Play Console account. The steps below are real — not placeholders
  # — but have never run against a real account/credential set (neither
  # existed at the time this was written), so double-check the exact secret
  # names/formats against each console's current UI before the first real run.
  # Both jobs skip with a clear message until their secrets exist, matching
  # the pattern in deploy-production.yml.
  ios-release-build:
    name: iOS — signed release build
    runs-on: macos-26
    # Store publication is an explicit release action, never a side effect of
    # merging an otherwise routine native or dependency change.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      # Required secrets:
      #   IOS_DIST_CERTIFICATE_BASE64      - `base64 -i Distribution.p12` of the
      #                                       Apple Distribution certificate + key
      #   IOS_DIST_CERTIFICATE_PASSWORD    - the .p12 export password
      #   IOS_PROVISIONING_PROFILE_BASE64  - `base64 -i profile.mobileprovision`,
      #                                       an App Store profile for com.ihype.app
      #   IOS_TEAM_ID                      - Apple Developer Team ID (App Store
      #                                       Connect → Membership)
      #   APP_STORE_CONNECT_KEY_ID         - App Store Connect API key ID
      #   APP_STORE_CONNECT_ISSUER_ID      - App Store Connect API issuer ID
      #   APP_STORE_CONNECT_API_KEY_BASE64 - `base64 -i AuthKey_<KEY_ID>.p8`
      # (Users and Access → Integrations → App Store Connect API, in App
      # Store Connect — create a key with the App Manager role.)
      - name: Check for signing secrets
        id: check
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}" ] && \
             [ -n "${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}" ] && \
             [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ] && \
             [ -n "${{ secrets.IOS_TEAM_ID }}" ]; then
            if [ "$PUBLISH" = "true" ] && { [ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ] || \
                 [ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] || \
                 [ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" ]; }; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::error::Publication was requested but App Store Connect upload secrets are incomplete."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS release signing secrets not fully configured yet — skipping signed build. Needs an Apple Developer Program account, a distribution certificate + provisioning profile for com.ihype.app, and an App Store Connect API key."
          fi

      # THE SDK IS A SUBMISSION GATE, AND NOTHING HERE WAS CHECKING IT.
      #
      # Run 282 signed, archived and exported a perfectly good .ipa and was
      # refused by App Store Connect at the last step:
      #
      #   Validation failed (409) SDK version issue. This app was built with
      #   the iOS 18.5 SDK. All iOS and iPadOS apps must be built with the
      #   iOS 26 SDK or later, included in Xcode 26 or later.
      #
      # macos-15 defaults to Xcode 16.4. Apple's floor moves roughly yearly and
      # is enforced by the UPLOAD, so the whole job can be green and the build
      # still unusable — which is why this is asserted here, before the archive,
      # rather than discovered after one. The available Xcodes are printed so a
      # future floor raise names what the image actually has instead of leaving
      # someone guessing at the runner label.
      - name: Select Xcode and assert the iOS SDK is new enough
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # Newest by version, not by name order: Xcode_26.1 must beat
          # Xcode_9.0, and a lexical sort does not.
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi

          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $SDK"

          MAJOR=${SDK%%.*}
          if [ "$MAJOR" -lt "$MIN_IOS_SDK_MAJOR" ]; then
            echo "::error::iOS SDK $SDK is below the App Store floor of $MIN_IOS_SDK_MAJOR. Apple refuses the upload with a 409 after a successful archive, so this fails here instead. The runner image needs an Xcode carrying SDK $MIN_IOS_SDK_MAJOR or later."
            exit 1
          fi
        env:
          # Apple's current floor. Raise this the day Apple raises theirs; a
          # build that passes here and is refused by altool means this number
          # is stale, not that the build is broken.
          MIN_IOS_SDK_MAJOR: '26'

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Sync Capacitor
        if: steps.check.outputs.configured == 'true'
        run: npx cap sync ios

      # Imports the distribution cert + provisioning profile into a
      # throwaway keychain scoped to this job only (the runner VM is
      # destroyed after the job, so a random password is fine — nothing
      # persists it).
      - name: Import signing certificate and provisioning profile
        if: steps.check.outputs.configured == 'true'
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          # SAY WHICH SECRET, AND WHY.
          #
          # This was two bare `base64 --decode` calls, and a bad value produced
          # exactly one line — `base64: stdin: (null): error decoding base64
          # input stream` — with no way to tell WHICH of the two failed, because
          # `set -e` stops at the first one and both look identical. Three real
          # runs were burned guessing. The value can never be printed, so the
          # log has to carry everything else: which secret, how long it was, and
          # what was wrong with it.
          #
          # Whitespace is stripped first, and that is a FIX rather than only a
          # diagnostic: a value pasted through a terminal or an editor can pick
          # up newlines or a stray space, and BSD base64 on the macOS runner is
          # stricter about those than the GNU one most people test against.
          #
          # The byte floor catches the case no decoder can: a value that IS
          # valid base64 but is the wrong thing — a password, a filename, a
          # truncated paste. It decodes happily and fails much later as an
          # unreadable keychain item.
          decode_secret() {
            local name="$1" value="$2" out="$3" floor="$4"
            local raw=${#value}
            if [ "$raw" -eq 0 ]; then
              echo "::error::$name is empty. Add it under Settings > Secrets and variables > Actions (a REPOSITORY secret, not an environment one)."
              return 1
            fi
            local cleaned; cleaned=$(printf '%s' "$value" | tr -d '[:space:]')
            local clean_len=${#cleaned}
            if ! printf '%s' "$cleaned" | base64 --decode > "$out" 2>/dev/null; then
              echo "::error::$name is not valid base64 ($raw chars, $clean_len after removing whitespace). Re-copy it with the B64 helper and paste again — this usually means something other than the base64 output reached the clipboard."
              return 1
            fi
            local bytes; bytes=$(wc -c < "$out" | tr -d ' ')
            if [ "$bytes" -lt "$floor" ]; then
              echo "::error::$name decoded to only $bytes bytes, expected at least $floor. It is valid base64 of the WRONG thing — check you encoded the right file."
              return 1
            fi
            echo "$name: $raw chars -> $bytes bytes"
          }

          decode_secret IOS_DIST_CERTIFICATE_BASE64 "$IOS_DIST_CERTIFICATE_BASE64" "$CERT_PATH" 1000
          decode_secret IOS_PROVISIONING_PROFILE_BASE64 "$IOS_PROVISIONING_PROFILE_BASE64" "$PROFILE_PATH" 1000

          # THE SAME FILE IN BOTH BOXES. Seven secrets are pasted by hand from
          # a clipboard that holds one thing at a time, so pasting one value
          # twice is the likeliest mistake of the whole setup — and it is
          # invisible to every check above, because the wrong file is still
          # valid base64 of a plausible size. It happened on run 266: both
          # decoded to exactly 3178 bytes, and the byte counts were the only
          # reason anyone could tell.
          #
          # A .p12 and a .mobileprovision are never the same size — the profile
          # embeds the certificate plus the entitlements — so identical output
          # means one paste went into two fields.
          if cmp -s "$CERT_PATH" "$PROFILE_PATH"; then
            echo "::error::IOS_DIST_CERTIFICATE_BASE64 and IOS_PROVISIONING_PROFILE_BASE64 decode to the SAME bytes. One value was pasted into both secrets — re-copy each from its own file (Distribution.p12 and the .mobileprovision)."
            exit 1
          fi

          # A .mobileprovision is a CMS-signed blob. Checking it HERE, rather
          # than letting `security cms -D` fail thirty lines down, means a
          # certificate pasted into the profile field is named as such instead
          # of surfacing as an unrelated plist error.
          if ! security cms -D -i "$PROFILE_PATH" > /dev/null 2>&1; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is not a provisioning profile — it decoded, but it is not a CMS-signed .mobileprovision. Check you encoded the .mobileprovision and not the certificate."
            exit 1
          fi

          # THE PASSWORD, CHECKED BY THE TOOL THAT CAN NAME IT.
          #
          # `security import` answers a wrong password with "SecKeychainItemImport:
          # The user name or passphrase you entered is not correct" — which reads
          # like the KEYCHAIN's password (generated randomly two lines above and
          # never wrong) rather than the .p12's. That sent this debugging session
          # down the wrong path once already. openssl says which.
          if ! openssl pkcs12 -in "$CERT_PATH" -passin pass:"$IOS_DIST_CERTIFICATE_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "::error::IOS_DIST_CERTIFICATE_PASSWORD does not open IOS_DIST_CERTIFICATE_BASE64. The two are a pair: if you re-exported the .p12, BOTH secrets must be updated together."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # `tr -d '\n '` collapses EVERY existing keychain into one nonsense
          # path. It happens to work on a stock macos-15 runner because there
          # is exactly one, and breaks the moment there are two — surfacing as
          # a codesign failure that never mentions the keychain line. Read them
          # as separate words instead.
          # shellcheck disable=SC2046
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[":]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/ihype-appstore.mobileprovision

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # BUILD NUMBER = run_number.run_attempt, not run_number alone.
      # App Store Connect rejects a duplicate build number permanently, so
      # re-running a failed run — the single most likely thing to happen on a
      # first release — would upload a number already burned and fail with a
      # message about the build rather than about the re-run.
      - name: Archive
        if: steps.check.outputs.configured == 'true'
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}.${{ github.run_attempt }} \
            archive

      - name: Export .ipa
        if: steps.check.outputs.configured == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ihype.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # PROVE IT IS SIGNED before uploading. `xcodebuild -exportArchive` can
      # emit an .ipa whose signing silently did not take, and the failure then
      # arrives from App Store Connect minutes later as a rejected upload with
      # a message about entitlements. Fail here, where the log still has the
      # signing steps in it.
      - name: Verify the .ipa is signed
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa was produced"; exit 1; }
          WORK=$(mktemp -d); unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign -dv --verbose=2 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'Authority=Apple Distribution' "$RUNNER_TEMP/codesign.txt" \
            || { echo "::error::the .ipa is not signed with an Apple Distribution identity"; exit 1; }

      - name: Upload to TestFlight
        if: steps.check.outputs.configured == 'true' && inputs.publish == true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            -o ~/private_keys/AuthKey_"$APP_STORE_CONNECT_KEY_ID".p8

          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa found in export directory"
            exit 1
          fi

          xcrun altool --upload-app \
            -f "$IPA_PATH" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Retain signed iOS artifact
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ihype-ios-signed-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

  android-release-build:
    name: Android — signed release build
    runs-on: ubuntu-latest
    # Store publication is an explicit release action, never a side effect of
    # merging an otherwise routine native or dependency change.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Required secrets:
      #   ANDROID_KEYSTORE_BASE64          - `base64 -i upload-keystore.jks` of
      #                                       the Play Console upload keystore
      #   ANDROID_KEYSTORE_PASSWORD        - keystore password
      #   ANDROID_KEY_ALIAS                - key alias within the keystore
      #   ANDROID_KEY_PASSWORD             - that key's password (often the
      #                                       same as the keystore password)
      #   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON - a Play Console service-account
      #                                       JSON key with Release Manager
      #                                       access (Play Console → Users and
      #                                       permissions → API access)
      - name: Check for signing secrets
        id: check
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            if [ "$PUBLISH" = "true" ] && [ -z "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::error::Publication was requested but GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is missing."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android release signing secrets not fully configured yet — skipping signed build. Needs a Google Play Console account, an upload keystore for com.ihype.app, and a Play Console API service account."
          fi

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Sync Capacitor
        if: steps.check.outputs.configured == 'true'
        run: npx cap sync android

      - name: Decode keystore
        if: steps.check.outputs.configured == 'true'
        # Through `env:`, never `${{ }}` inside the script. A secret
        # interpolated into the shell is pasted as literal text, so a value
        # that arrived with line breaks (GNU base64 wraps at 76 columns unless
        # -w0) injects raw newlines into the generated bash rather than
        # reaching base64 as one string.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Signing properties are passed on the command line (Android Gradle
      # Plugin's built-in android.injected.signing.* mechanism) rather than
      # committing a signingConfig to build.gradle, so no keystore path or
      # password ever needs to exist in the repo itself.
      # versionCode must strictly increase on every Play upload — the value
      # committed in build.gradle (1) would be rejected on the 2nd release.
      # github.run_number is monotonic per workflow, so injecting it as the
      # versionCode (via AGP's built-in android.injected.version.code) makes
      # every one-click release upload a fresh, higher code with no manual
      # edit. versionName (the human "1.0" users see) stays as-is in
      # build.gradle — bump that by hand only when you want a new marketing
      # version.
      - name: Build signed release bundle
        if: steps.check.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # THE ARITHMETIC HAPPENS IN THE SHELL, BECAUSE GITHUB HAS NONE.
          #
          # This was an expression multiplying run_number by 100 and adding
          # run_attempt — written out here rather than quoted verbatim, because
          # a `${{ }}` token inside a `run:` block is interpolated even when it
          # sits behind a `#`, so quoting the broken form can re-break the file.
          # It took the whole workflow down: the Actions expression language
          # has logical and comparison operators only — no `*`, no `+` — so an
          # arithmetic expression is a parse error, and a parse error anywhere
          # in the file is a STARTUP FAILURE. The run completes in under a
          # second with zero jobs and a red tick, which looks nothing like a
          # broken build step and carries no log to read.
          #
          # It therefore broke the debug builds too, on every push and on
          # branches whose diff never touched this file — that is what made it
          # readable as somebody else's problem rather than as this line.
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Still run_number-major so a re-run of a failed release outranks the
          # attempt before it: Play refuses a versionCode it has already seen.
          VERSION_CODE=$(( RUN_NUMBER * 100 + RUN_ATTEMPT ))
          echo "versionCode $VERSION_CODE"
          ./gradlew bundleRelease \
            -Pandroid.injected.version.code="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # `android.injected.signing.*` has never run against a real keystore in
      # this repository. If gradle emits an unsigned bundle, learn it here
      # rather than from Play's upload dialog.
      #
      # NOT `-strict`, AND NOT THE EXIT CODE. Both halves of the original
      # check were wrong, in opposite directions, and the first real signed
      # build is what showed it.
      #
      # An Android upload key is SELF-SIGNED by design — there is no CA above
      # it, and Play App Signing re-signs the bundle with Google's own key
      # before anything ships. `-strict` promotes "signer certificate is
      # self-signed" and "unable to find valid certification path" to a
      # non-zero exit, so the gate failed a correctly signed bundle and would
      # have failed every legitimate Android release this project ever builds.
      #
      # The exit code is no better in the other direction: `jarsigner -verify`
      # on an UNSIGNED jar prints "jar is unsigned" and exits 0. So the thing
      # this step exists to catch was the one thing the exit code could not
      # report. The OUTPUT STRING is the test.
      #
      # "jar verified, with signer errors." is the expected success line for a
      # self-signed release bundle. An expired certificate is still refused,
      # because that one is real — matched on jarsigner's exact wording rather
      # than on "expire", which also appears in the harmless no-timestamp
      # warning ("...after any of the signer certificates expire").
      - name: Verify the .aab is signed
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          [ -n "$AAB" ] || { echo "::error::no .aab was produced"; exit 1; }

          VERIFY=$(jarsigner -verify "$AAB" 2>&1) || true

          # NO `| head`. THAT IS A RACE, AND IT PASSED LOCALLY AND FAILED HERE.
          #
          # jarsigner's inconsistency notice runs to ~450 lines on an .aab, and
          # `echo "$VERIFY" | head -3` makes `head` exit after three of them.
          # Whether `echo` is still writing at that moment decides whether it
          # takes SIGPIPE — and under `set -o pipefail` a SIGPIPE'd writer fails
          # the whole pipeline, which `set -e` turns into an exit 1. So the step
          # classified the bundle CORRECTLY as signed and then died printing the
          # good news:
          #
          #   line 16: echo: write error: Broken pipe
          #   jar verified.
          #
          # A stub with the same line count won that race on one machine and
          # lost it on the runner, so testing this line locally proves nothing.
          # The first line is taken with parameter expansion instead — no pipe,
          # no second process, nothing to race.
          VERDICT=${VERIFY%%$'\n'*}

          case "$VERIFY" in
            *"certificate has expired"*)
              echo "$VERDICT"
              echo "::error::the .aab is signed with an EXPIRED certificate — generate a new upload keystore."
              exit 1
              ;;
            *"jar verified"*)
              echo "$VERDICT"
              echo "signed: $AAB"
              ;;
            *)
              # An unsigned or unreadable jar answers in a line or two, so the
              # whole thing is worth printing on this path — the 450-line notice
              # only appears on success.
              echo "$VERIFY"
              echo "::error::the .aab is not signed — check the keystore secrets."
              exit 1
              ;;
          esac

      # Uploads to the Play *internal testing* track and releases it to your
      # internal testers immediately (status: completed) — that's the one-click
      # payoff. Internal testing only reaches the testers you explicitly list
      # in Play Console, so a bad build never reaches the public. Promoting
      # internal → production is a separate, deliberate click in the Play
      # Console UI.
      # First-time caveat: the very first upload for a brand-new app usually
      # has to be done through the Play Console UI (to complete the store
      # listing, content rating, and data-safety form) before the API will
      # accept uploads. After that first manual upload, this button works for
      # every subsequent release.
      - name: Upload to Play Console
        if: steps.check.outputs.configured == 'true' && inputs.publish == true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ihype.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Retain signed Android artifact
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ihype-android-signed-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
