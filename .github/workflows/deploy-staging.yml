name: Build and deploy iHYPE staging

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deploy-staging.yml
      - wrangler.staging.toml
      - scripts/worker-size-budget.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://staging.ihype.org
      NEXT_PUBLIC_BASE_URL: https://staging.ihype.org
      FEATURE_ENABLE_TICKET_PAYMENTS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run cf:build
      - name: Validate the staging Worker bundle
        run: node scripts/worker-size-budget.mjs
        env:
          WORKER_SIZE_WRANGLER_CONFIG: wrangler.staging.toml
      - name: Save the validated bundle for a manual deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ihype-staging-bundle
          path: .open-next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Staging – ihype
    concurrency: ihype-staging-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ihype-staging-bundle
          path: .open-next/
      - name: Deploy the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure the staging Cloudflare deployment secrets in Staging – ihype."
            exit 1
          fi
          npx --no-install wrangler deploy --config wrangler.staging.toml --autoconfig=false
