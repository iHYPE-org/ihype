# Cloudflare edge guards — the two things Project Galileo's Business plan makes
# free, applied from the repository so the repository knows they exist.
#
#   1. WAF rate-limiting rules in front of /api/auth/*, /api/register and
#      /api/analytics/track (scripts/cloudflare-edge-guards.mjs has the numbers
#      and the reasoning: a flood backstop, deliberately above the app's own
#      per-IP buckets so a venue's shared wifi is never locked out).
#   2. Cloudflare Access in front of ihype.org/admin, allowing admin@ihype.org
#      through a one-time PIN — a second gate ahead of the app's own admin check.
#
# workflow_dispatch only. The default is a DRY RUN that prints what would
# change; set `apply` to true to make the changes. Idempotent: a second apply
# reports everything unchanged.
#
# The token is the deploy token. If it lacks a permission the script names the
# call that failed and the permission it needs (Zone WAF: Edit, Zone: Read;
# Access: Apps and Policies: Edit; Access: Organizations, Identity Providers
# and Groups: Edit) — add it in the Cloudflare dashboard and re-run.
#
# Exit 3 means the account has no Zero Trust organization yet: that is a
# one-time dashboard step (choose a team name), and the script will not take
# it for you. The rate-limit half still applies in that case.
name: Cloudflare edge guards

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the changes (false = dry run, prints the plan only)'
        required: false
        default: false
        type: boolean
      skip_access:
        description: 'Skip the Access application (rate limits only)'
        required: false
        default: false
        type: boolean

jobs:
  guards:
    name: ${{ inputs.apply && 'Apply' || 'Dry run' }}
    runs-on: ubuntu-latest
    environment: Production – ihype
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: '24'

      - name: Plan or apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          APPLY: ${{ inputs.apply }}
          SKIP_ACCESS: ${{ inputs.skip_access }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for this environment."
            exit 1
          fi
          args=()
          [ "${APPLY}" = "true" ] && args+=(--apply)
          [ "${SKIP_ACCESS}" = "true" ] && args+=(--skip-access)
          node scripts/cloudflare-edge-guards.mjs "${args[@]}"
