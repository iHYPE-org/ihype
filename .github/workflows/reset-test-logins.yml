name: Reset test logins

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type: reset test logins'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: Production – ihype
    if: github.event.inputs.confirm == 'reset test logins'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      RESET_LOGIN_PASSWORD: ${{ secrets.TEMP_LOGIN_RESET_PASSWORD }}
      CONFIRM_RESET_TEST_LOGINS: ${{ github.event.inputs.confirm }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma generate
      - run: npm run admin:reset-test-logins
        env:
          NODE_ENV: production
