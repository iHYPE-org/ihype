name: Reset test logins

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type: reset test logins'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: Production – ihype
    if: github.event.inputs.confirm == 'reset test logins'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      RESET_LOGIN_PASSWORD: ${{ secrets.TEMP_LOGIN_RESET_PASSWORD }}
      CONFIRM_RESET_TEST_LOGINS: ${{ github.event.inputs.confirm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma generate
      - run: npm run admin:reset-test-logins
        env:
          NODE_ENV: production
