name: CI

on:
  pull_request:
    branches:
      - main
    # `labeled` is load-bearing, not tidiness. The expensive stages below gate
    # on `github.event.pull_request.labels`, which is a SNAPSHOT of the event
    # payload — and the default type list is [opened, synchronize, reopened].
    # A label added after the PR is opened therefore fired no new run, and the
    # run from `opened` carried an empty label list, so every gated stage
    # skipped and the check went green anyway.
    #
    # Since a PR cannot be labelled before it exists, that made the documented
    # procedure ("add `full-ci` to any PR touching the shell, auth, routing,
    # the service worker or anything Workerd-specific") a no-op through the
    # normal flow: the label was applied, nothing re-ran, and the PR reported
    # success with none of the coverage it was asked for. Found on #652, whose
    # 12 gated steps all skipped despite carrying the label.
    #
    # `unlabeled` is deliberately absent — removing a label should not spend
    # 15 minutes of runner time re-proving a smaller suite.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build, and browser smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ihype
          POSTGRES_PASSWORD: ihype
          POSTGRES_DB: ihype
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ihype"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Expensive stages (browser suites, Cloudflare build, Workerd smokes,
      # Lighthouse) run only when a PR carries the `full-ci` label. They are
      # ~11 of this job's ~15 minutes, and the org's Actions allowance cannot
      # currently pay for them on every push -- jobs were being cancelled
      # mid-run, so NOTHING was being verified. A 4-minute job that finishes
      # beats a 15-minute job that gets killed at minute 14.
      #
      # This moves the safety net, it does not remove it:
      # deploy-production.yml independently re-runs the tests, the Cloudflare
      # build, the Worker bundle budget AND a pre-deploy Workerd smoke before
      # it deploys, and skips every remaining step if any of them fail. So a
      # broken change still cannot reach production; it just gets caught at
      # deploy time rather than at merge time.
      #
      # WHICH stage set runs is decided by the "Decide the CI depth" step
      # below, from the diff, and it writes FULL_CI to $GITHUB_ENV. It is NOT
      # set here, because a job-level default would win over nothing and only
      # confuse the precedence.
      #
      # It used to be `contains(github.event.pull_request.labels.*.name,
      # 'full-ci')` alone, and a separate workflow applied that label from the
      # changed paths. That could not work: Actions does not start a workflow
      # run from an event created with the GITHUB_TOKEN, so the label landed
      # on the PR and no `labeled` run ever fired -- the same silent skip,
      # arrived at through the automation written to prevent it. Deciding
      # in-job needs no second event at all.
      DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
      AUTH_SECRET: ci-only-auth-secret-change-me-0123456789
      NEXTAUTH_SECRET: ci-only-auth-secret-change-me-0123456789
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      FEATURE_REQUIRE_INVITE_CODE: 'false'
      FEATURE_ENABLE_TICKET_PAYMENTS: 'false'
      NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          # The depth decision below diffs against the PR base, which a
          # depth-1 checkout does not have.
          fetch-depth: 0

      - name: Decide the CI depth
        # What each pattern buys, so the list can be argued with rather than
        # cargo-culted:
        #   *.css                     - layout and geometry; only a browser sees it
        #   components/shell, app/app - the two shells' chrome contracts
        #   components/mmm            - the map, the panes, the player
        #   lib/*-nav.ts              - the route registries both shells read
        #   middleware.ts             - auth redirects and CSP, Edge-runtime only
        #   public/sw.js              - caching, and it can serve a stale app
        #   e2e/                      - the tests themselves
        #   layout.tsx                - metadata, manifest, viewport, providers
        #   this workflow             - so a change to the gate proves itself
        #
        # The `full-ci` label still forces the full set, as a manual override
        # for a diff these patterns do not catch. It is no longer the only way
        # in, which is what made it a single point of forgetting.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          if [ "$LABELLED" = "true" ]; then
            echo "FULL_CI=true" >> "$GITHUB_ENV"
            echo "Full CI: the PR carries the full-ci label."
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"; echo "$changed"
          pattern='(\.css$|^src/components/shell/|^src/components/mmm/|^src/app/app/|^src/lib/(app-nav|mmm-nav)\.ts$|^middleware\.ts$|^public/sw\.js$|^e2e/|^src/app/layout\.tsx$|^\.github/workflows/ci\.yml$)'
          if echo "$changed" | grep -qE "$pattern"; then
            echo "FULL_CI=true" >> "$GITHUB_ENV"
            echo "Full CI: this diff touches the shell, routing, styling or the service worker."
          else
            echo "FULL_CI=false" >> "$GITHUB_ENV"
            echo "Trimmed CI: nothing the gated stages cover was touched."
          fi

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        # Dev-only advisories (currently @opentelemetry/core, transitively
        # pinned by @sentry/nextjs and lighthouse) don't block merges — only
        # vulnerabilities reachable from what actually ships to production do.
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error

      - name: Source policy lint
        run: npm run lint

      - name: Design guard
        run: npm run guard:design

      - name: Gated migration guard
        run: npm run guard:migrations

      - name: App shell conversion audit
        # Fails when a page inside the signed-in shell grows a card/row/stat/
        # eyebrow of its own instead of using the design system's primitive.
        # Strict is safe to enable because the drift set is currently zero.
        run: npm run audit:shell -- --strict

      - name: CSS override audit
        # Catches the failure audit:shell structurally cannot see: a selector
        # defined twice, where a later block silently wins. That is why /login
        # and /register rendered a retired design for months while the correct
        # block sat dead directly above it, with every other check green.
        #
        # --max is a RATCHET, not a target. 145 such pairs already existed when
        # this landed; they render correctly today only because the right rule
        # happens to come last. Existing debt passes, a NEW duplicate fails.
        # Lower this number as they get fixed. Never raise it.
        run: npm run audit:css -- --max=139

      - name: Unit tests
        run: npm test

      - name: Prepare scratch database
        if: env.FULL_CI == 'true'
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS citext;'
          npx prisma db push --accept-data-loss

      - name: Install Playwright browser
        if: env.FULL_CI == 'true'
        run: npx playwright install chromium --with-deps

      - name: Mandatory public browser smoke
        if: env.FULL_CI == 'true'
        run: npx playwright test e2e/public-smoke.spec.ts --project=chromium

      - name: Mandatory authenticated E2E suite (Workerd)
        if: env.FULL_CI == 'true'
        # Runs against a real `wrangler dev` (workerd) instance, not `next
        # dev` — src/lib/db.ts intentionally imports the wasm/workerd-only
        # Prisma engine (see the comment at the top of that file), which
        # can't load under plain `next dev`. Any DB read inside auth()'s jwt
        # callback (which runs on every request, not just sign-in) throws
        # there, so no authenticated e2e test can ever pass against `npm run
        # dev` regardless of secrets. See the environment note at the top of
        # e2e/auth.spec.ts and scripts/e2e-workerd.mjs for the full story —
        # verified working end to end (real Postgres, real WebAuthn ceremony
        # via Chromium's CDP virtual authenticator) before this was wired in.
        timeout-minutes: 15
        run: |
          npm run cf:build
          node scripts/e2e-workerd.mjs
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          E2E_WORKERD_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          AUTH_SECRET: ci-only-e2e-workerd-secret-0123456789
          NEXTAUTH_SECRET: ci-only-e2e-workerd-secret-0123456789
          # Must match scripts/e2e-workerd.mjs's BASE (localhost:8787,
          # E2E_WORKERD_PORT default) exactly: NEXT_PUBLIC_* values are
          # inlined into the bundle at `next build` time, not read at
          # runtime, so a mismatch here breaks anything origin-sensitive —
          # WebAuthn registration/auth checks the request origin against
          # this value and rejects a mismatch outright.
          NEXT_PUBLIC_BASE_URL: http://localhost:8787
          NEXT_PUBLIC_APP_URL: http://localhost:8787
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

      - name: Cloudflare build
        if: env.FULL_CI == 'true'
        run: npm run cf:build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_BASE_URL: https://ihype.org
          NEXT_PUBLIC_APP_URL: https://ihype.org
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADSF8WNxaeBIRmR7"

      - name: Worker bundle size budget
        if: env.FULL_CI == 'true'
        run: node scripts/worker-size-budget.mjs
        env:
          CLOUDFLARE_API_TOKEN: dry-run-placeholder
          CLOUDFLARE_ACCOUNT_ID: dry-run-placeholder

      - name: Mandatory authenticated Workerd security smoke
        if: env.FULL_CI == 'true'
        timeout-minutes: 20
        run: |
          set -o pipefail
          node scripts/workerd-smoke.mjs 2>&1 | tee workerd-security-smoke.log
        env:
          WORKERD_SMOKE_MODE: security
          DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_CRON_SECRET: ci-only-workerd-health-secret-0123456789
          AUTH_SECRET: ci-only-auth-secret-change-me-0123456789
          NEXTAUTH_SECRET: ci-only-auth-secret-change-me-0123456789

      - name: Mandatory authenticated Workerd performance budget
        if: env.FULL_CI == 'true'
        # 20 was not enough on 2026-08-17 (PR #716): four of six pages went
        # over budget, each one paying a second full audit to confirm a breach
        # that could not fail the build, and the step was killed five seconds
        # after its own script printed "all checks passed". The confirmation
        # pass is now skipped unless LIGHTHOUSE_BUDGET_ENFORCE=1
        # (scripts/lighthouse-budget.mjs), which is the real fix; this is the
        # margin so that a slow runner alone cannot reproduce the same failure.
        timeout-minutes: 30
        run: |
          set -o pipefail
          node scripts/workerd-smoke.mjs 2>&1 | tee workerd-performance-smoke.log
        env:
          WORKERD_SMOKE_MODE: performance
          DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_CRON_SECRET: ci-only-workerd-health-secret-0123456789
          AUTH_SECRET: ci-only-auth-secret-change-me-0123456789
          NEXTAUTH_SECRET: ci-only-auth-secret-change-me-0123456789

      - name: Upload Workerd diagnostics
        if: always() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workerd-smoke-diagnostics
          path: workerd-*-smoke.log
          if-no-files-found: ignore

      - name: Upload Lighthouse report
        if: always() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lighthouse-budget-report
          path: lighthouse-budget-report.json
          if-no-files-found: ignore
