name: CI

on:
  pull_request:
    branches:
      - main
    # Default types (opened, synchronize, reopened). `labeled` used to be here
    # and is deliberately gone: no stage reads a label any more, so firing a
    # full run on a label change would spend the machine on nothing.
    #
    # Worth keeping the reason it was ever needed, because it is a general
    # Actions trap rather than a fact about this repo: `pull_request.labels` is
    # a SNAPSHOT of the event payload, so a label added after a PR opens
    # changes nothing about the run that already happened, and no new run fires
    # unless `labeled` is in this list. On #652 that meant twelve gated steps
    # skipped while the check reported success.

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build, and browser smoke
    # Our own runner (Azure, 4 vCPU, East US) — see
    # docs/runbooks/ci-self-hosted-runner.md. Minutes here are free, which is
    # the whole reason the gated stages below could come back: the org's
    # Actions allowance was the constraint, never the workload.
    runs-on: [self-hosted, linux, x64, ihype-ci]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ihype
          POSTGRES_PASSWORD: ihype
          POSTGRES_DB: ihype
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ihype"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # EVERY STAGE RUNS ON EVERY PUSH AGAIN (2026-08-26).
      #
      # The browser suites, the Cloudflare build, the Workerd smokes and
      # Lighthouse used to run only when the diff touched certain paths — about
      # 11 of this job's ~15 minutes. They were gated because the org's Actions
      # allowance could not pay for them: jobs were being CANCELLED mid-run, so
      # nothing was being verified at all. That was the right call then, and it
      # is no longer needed — this job runs on our own machine now, where
      # minutes cost nothing (docs/runbooks/ci-self-hosted-runner.md).
      #
      # Gone with it: the "Decide the CI depth" step, the FULL_CI variable, and
      # the `full-ci` label as a manual override. Two hard-won notes are kept
      # here because they explain failures that will otherwise be rediscovered:
      # a label added after a PR opens does NOT re-run the workflow unless
      # `labeled` is in the trigger types (a run from `opened` carries an empty
      # label list and skips silently while reporting success), and a label
      # applied by a workflow using GITHUB_TOKEN starts no run at all. Both are
      # why gating on labels was abandoned for gating on the diff, before both
      # were abandoned for this.
      #
      # The deploy-time safety net is unchanged: deploy-production.yml
      # independently re-runs the tests, the Cloudflare build, the Worker
      # bundle budget and a pre-deploy Workerd smoke, and skips every later
      # step if any of them fail.
      DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
      AUTH_SECRET: ci-only-auth-secret-change-me-0123456789
      NEXTAUTH_SECRET: ci-only-auth-secret-change-me-0123456789
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      FEATURE_REQUIRE_INVITE_CODE: 'false'
      FEATURE_ENABLE_TICKET_PAYMENTS: 'false'
      NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          # Full history, not depth-1. The self-hosted runner reuses its
          # workspace between runs, so this costs a fetch of what is new rather
          # than a fresh clone — and several checks read git history.
          fetch-depth: 0

      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        # Dev-only advisories don't block merges — only vulnerabilities
        # reachable from what actually ships to production do. The accepted
        # dev-only set, with reasons, is docs/dependency-advisories.md.
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error

      - name: Source policy lint
        run: npm run lint

      - name: Design guard
        run: npm run guard:design

      - name: Gated migration guard
        run: npm run guard:migrations

      - name: Vendored design-system components guard
        # src/components/ds/ is GENERATED from the vendored handoff's own
        # component sources. This fails if the checked-in files no longer match
        # what the design system would produce — which is the whole mechanism
        # that stops a console control being quietly re-authored here (the
        # shipped TunerDial and the design system's had already diverged that
        # way). A deliberate change belongs in Claude Design and a re-vendored
        # handoff, not in src/.
        run: npm run guard:ds

      - name: MMM workflow primitive audit
        # Fails when a page inside the signed-in shell grows a card/row/stat/
        # eyebrow of its own instead of using the design system's primitive.
        # Strict is safe to enable because the drift set is currently zero.
        run: npm run audit:shell -- --strict

      - name: CSS override audit
        # Catches the failure audit:shell structurally cannot see: a selector
        # defined twice, where a later block silently wins. That is why /login
        # and /register rendered a retired design for months while the correct
        # block sat dead directly above it, with every other check green.
        #
        # --max started life as a RATCHET at 145 — the override pairs that
        # already existed when this landed, rendering correctly only because
        # the right rule happened to come last. That debt is fully paid down
        # (2026-08-31: 0 overrides), so zero is now a GATE, not a countdown.
        # Never raise it: any new duplicate selector fails here.
        run: npm run audit:css -- --max=0

      - name: Route inventory ratchet
        # `audit:routes` classifies every page.tsx three ways and --max-legacy
        # is a ratchet that must go DOWN. It reached ZERO on 2026-08-22 — the
        # legacy app shell has no rendered pages left — and zero is the number
        # worth defending: a new page inside the retired shell is now a build
        # failure rather than a note in a report nobody runs. Node-only, so it
        # belongs in the fast lane rather than behind the browser gate.
        run: npm run audit:routes -- --max-legacy=0

      - name: Console colour coverage ratchet
        # The other ratchet: how many member-facing routes still paint a raw
        # colour literal instead of a token. It reached ZERO the same day — 89 of
        # 89 paint only from tokens — so this is now a gate rather than a
        # countdown. Same contract as the others: the number goes down, never up.
        run: npm run audit:retro

      - name: Theme contrast gate
        # Every [data-theme] block in globals.css (plus :root and the walnut
        # material) is re-measured: ink and the copy tokens must clear 4.5:1 on
        # their own ground. Added with the five member-selectable themes
        # (2026-08-24) — a theme block is exactly the place a plausible-looking
        # value ships unmeasured, because nothing else renders it by default.
        run: npm run audit:contrast

      - name: Unit tests
        run: npm test

      - name: Prepare scratch database
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS citext;'
          npx prisma db push --accept-data-loss

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Dock geometry
        # The dock is the whole of the app's navigation and every figure in it
        # is load-bearing on the others (DESIGN_SYNC row 289). This drives
        # Chromium against slices of the real stylesheets — no build and no
        # database, since /app/* is behind auth — and fails on a wrapped bar,
        # mismatched knobs, an overflowing knob cap, a clipped station name or
        # a covered step chevron. It is gated with the other browser stages,
        # and the depth step already selects them for exactly the diffs that
        # can break it: src/components/mmm/, src/components/ds/ and any *.css.
        run: npm run measure:dock

      - name: Measure the map's date picker
        # Same method and the same reason as the dock probe above: /app/map is
        # behind auth, so the picker is mounted against slices of the real
        # stylesheet rather than driven end-to-end. It catches the three things
        # reading cannot — a day cell under MOBILE.md's 44x44 (a grid track,
        # so padding cannot rescue it), a popover hanging off the pane, and a
        # month that renders five rows instead of six. Both real defects it
        # found on the way in were invisible in the source: the popover's left
        # edge at -56px, and the search field overflowing its own column by
        # 52px above 620px.
        run: npm run measure:datepick

      - name: Mandatory public browser smoke
        run: npx playwright test e2e/public-smoke.spec.ts --project=chromium

      - name: Mandatory authenticated E2E suite (Workerd)
        # Runs against a real `wrangler dev` (workerd) instance, not `next
        # dev` — src/lib/db.ts intentionally imports the wasm/workerd-only
        # Prisma engine (see the comment at the top of that file), which
        # can't load under plain `next dev`. Any DB read inside auth()'s jwt
        # callback (which runs on every request, not just sign-in) throws
        # there, so no authenticated e2e test can ever pass against `npm run
        # dev` regardless of secrets. See the environment note at the top of
        # e2e/auth.spec.ts and scripts/e2e-workerd.mjs for the full story —
        # verified working end to end (real Postgres, real WebAuthn ceremony
        # via Chromium's CDP virtual authenticator) before this was wired in.
        timeout-minutes: 15
        run: |
          # The public smoke above ran `next dev`, which writes its own route
          # typegen to .next/dev/types — and tsconfig includes that directory,
          # so `next build`'s typecheck reads it. Playwright stops the dev
          # server the moment its tests finish, and a validator.ts cut off
          # mid-write is a TS1128 in a file nobody authored (PR #793: green on
          # one push, red on the next, same routes). Start the build from
          # nothing that a dev server wrote.
          rm -rf .next
          npm run cf:build
          node scripts/e2e-workerd.mjs
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          E2E_WORKERD_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          AUTH_SECRET: ci-only-e2e-workerd-secret-0123456789
          NEXTAUTH_SECRET: ci-only-e2e-workerd-secret-0123456789
          # Must match scripts/e2e-workerd.mjs's BASE (localhost:8787,
          # E2E_WORKERD_PORT default) exactly: NEXT_PUBLIC_* values are
          # inlined into the bundle at `next build` time, not read at
          # runtime, so a mismatch here breaks anything origin-sensitive —
          # WebAuthn registration/auth checks the request origin against
          # this value and rejects a mismatch outright.
          NEXT_PUBLIC_BASE_URL: http://localhost:8787
          NEXT_PUBLIC_APP_URL: http://localhost:8787
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

      - name: Upload Playwright failure evidence
        # Every e2e failure so far has printed "Error Context:
        # test-results/…/error-context.md" into a log and then thrown the file
        # away with the runner — two identical dial failures on PR #747 could
        # not be diagnosed because the ARIA snapshots and traces they pointed
        # at never left the machine. Failure-only, so a green run uploads
        # nothing.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mandatory alpha acceptance walk
        # The alpha list end to end against the real Workers build: signup and
        # its username derivation, uploads with real media, the discover deck,
        # playlists, the HYPE economy and its ledger, community votes, and the
        # ticket path through sale, scan, webhook replay and refund
        # reconciliation. Runs WITHOUT Stripe credentials here — the money
        # items report themselves BLOCKED rather than failing, which keeps the
        # other two dozen honest in CI while the full walk (advertising
        # authorization, capture and settlement included) is run against
        # test-mode Stripe by hand before a release.
        timeout-minutes: 20
        run: |
          set -o pipefail
          node scripts/make-alpha-fixtures.mjs
          node scripts/e2e-workerd.mjs --serve > alpha-walk-server.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8787/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          npm run alpha:walk 2>&1 | tee alpha-walk.log
          STATUS=${PIPESTATUS[0]}
          kill "$SERVER_PID" 2>/dev/null || true
          exit "$STATUS"
        env:
          ALPHA_BASE_URL: http://localhost:8787
          ALPHA_SONG: e2e/fixtures/media/alpha-song.wav
          ALPHA_GRAPHIC: e2e/fixtures/media/alpha-graphic.png
          ALPHA_AD_AUDIO: e2e/fixtures/media/alpha-ad-spot.wav
          DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          E2E_WORKERD_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          AUTH_SECRET: ci-only-e2e-workerd-secret-0123456789
          NEXTAUTH_SECRET: ci-only-e2e-workerd-secret-0123456789
          PLAYWRIGHT_AUTH_COOKIE_SECURE: 'true'

      - name: Cloudflare build
        run: npm run cf:build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_BASE_URL: https://ihype.org
          NEXT_PUBLIC_APP_URL: https://ihype.org
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADSF8WNxaeBIRmR7"

      - name: Worker bundle size budget
        run: node scripts/worker-size-budget.mjs
        env:
          CLOUDFLARE_API_TOKEN: dry-run-placeholder
          CLOUDFLARE_ACCOUNT_ID: dry-run-placeholder

      - name: Mandatory authenticated Workerd security smoke
        timeout-minutes: 20
        run: |
          set -o pipefail
          node scripts/workerd-smoke.mjs 2>&1 | tee workerd-security-smoke.log
        env:
          WORKERD_SMOKE_MODE: security
          DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_CRON_SECRET: ci-only-workerd-health-secret-0123456789
          AUTH_SECRET: ci-only-auth-secret-change-me-0123456789
          NEXTAUTH_SECRET: ci-only-auth-secret-change-me-0123456789

      - name: Mandatory authenticated Workerd performance budget
        # 20 was not enough on 2026-08-17 (PR #716): four of six pages went
        # over budget, each one paying a second full audit to confirm a breach
        # that could not fail the build, and the step was killed five seconds
        # after its own script printed "all checks passed". The confirmation
        # pass is now skipped unless LIGHTHOUSE_BUDGET_ENFORCE=1
        # (scripts/lighthouse-budget.mjs), which is the real fix; this is the
        # margin so that a slow runner alone cannot reproduce the same failure.
        timeout-minutes: 30
        run: |
          set -o pipefail
          node scripts/workerd-smoke.mjs 2>&1 | tee workerd-performance-smoke.log
        env:
          WORKERD_SMOKE_MODE: performance
          DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_DATABASE_URL: postgresql://ihype:ihype@localhost:55432/ihype
          WORKERD_SMOKE_CRON_SECRET: ci-only-workerd-health-secret-0123456789
          AUTH_SECRET: ci-only-auth-secret-change-me-0123456789
          NEXTAUTH_SECRET: ci-only-auth-secret-change-me-0123456789

      - name: Upload Workerd diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workerd-smoke-diagnostics
          path: workerd-*-smoke.log
          if-no-files-found: ignore

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lighthouse-budget-report
          path: lighthouse-budget-report.json
          if-no-files-found: ignore
