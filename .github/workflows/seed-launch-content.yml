name: Seed launch content

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type: seed ihype launch'
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: Production – ihype
    if: github.event.inputs.confirm == 'seed ihype launch'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CONFIRM_LAUNCH_SEED: ${{ github.event.inputs.confirm }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed:launch
