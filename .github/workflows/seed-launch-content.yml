name: Seed launch content

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type: seed ihype launch'
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: Production – ihype
    if: github.event.inputs.confirm == 'seed ihype launch'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CONFIRM_LAUNCH_SEED: ${{ github.event.inputs.confirm }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      # `--include=dev` is load-bearing under the NODE_ENV above: npm treats
      # NODE_ENV=production as --omit=dev, and `prisma` is a devDependency, so
      # the root `postinstall: prisma generate` would fail and take `npm ci`
      # with it. NODE_ENV cannot simply be dropped — `prisma/launch-seed.ts`
      # only enforces its confirmation guard when it is 'production'.
      # (Measured 2026-09-04. This workflow had never been run, so the fault
      # had never been observed.)
      - run: npm ci --include=dev
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed:launch
