# Encrypted off-cluster database backups — the free stand-in for Supabase PITR.
#
# PITR is a paid add-on and this project has no starting capital, so without
# this workflow there is NO copy of the production database anywhere outside
# the live cluster: the Supabase free plan does not provide downloadable daily
# backups either. The daily `backup-verify` cron proves the live database is up
# and populated. It has never proven a copy exists, because one did not.
#
# CADENCE. Requested every 6 hours; DELIVERED in 8 or less, which is what sets
# the RPO: a disaster loses at most the transactions since the last dump. The
# two differ because a scheduled workflow is a request GitHub does not
# guarantee — measured 2026-09-06, this had never once fired on time and 48% of
# gaps exceeded the 6 h that every document here promised. `npm run
# check:backup-cadence` measures the delivered gaps and runs nightly; the
# accepted risk is recorded in docs/runbooks/backup-restore-drill.md. Six
# hours is also chosen against the Actions allowance — this repository has
# already had CI runs cancelled and one production deploy never created because
# the budget ran out (see deploy-production.yml's workflow_dispatch note).
# 4 runs/day at ~2 minutes is ~240 minutes/month. Hourly would be ~1,400 and
# would compete with the deploys and CI runs that keep the site shipping.
#
# The keys this writes are fixed rotating slots that overwrite themselves, so
# storage is bounded with no lifecycle rule and no S3 credential. See the header
# of scripts/backup-database.mjs.
name: Database backup

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC — requested at :37, not :00. The 00:00
    # run additionally writes the day-of-month slot, giving ~a month of daily
    # copies alongside the week of 6-hourly ones.
    #
    # WHY :37. A scheduled workflow is a REQUEST, not a guarantee, and GitHub
    # queues heaviest at the top of the hour. Measured over 24 successful runs
    # (2026-09-01 to 09-06) this fired 2.21-5.48 h late EVERY time, median
    # 4.14 h, and because the delay varies the gap between dumps swung 4.47 to
    # 7.93 h — 48% of gaps past the 6 h RPO every document here promised.
    # Moving off :00 is a HYPOTHESIS about the queue, not a measurement: run
    # `npm run check:backup-cadence` in a week and let it say whether it
    # worked. Do not lower the documented RPO on the strength of this comment.
    #
    # FIRST EVIDENCE, 2026-09-07: the next run landed 21 min after its slot,
    # against a 4.08 h median before. One run is not a week — but see the cost,
    # below, which is the part to act on.
    #
    # **AFTER ANY EDIT TO THIS FILE, DISPATCH THE WORKFLOW BY HAND** — cheap
    # insurance, and read the next paragraph before believing why.
    #
    # **THE EVIDENCE THIS RULE WAS BUILT ON WAS WRONG, AND THE CORRECTION IS
    # THE MORE USEFUL LESSON (2026-09-08).** On 09-07 two comment-only edits
    # (#846 13:49, #845 13:58) were followed by the 18:37 slot appearing not to
    # fire, and that was written up here as a second confirmed case. It fired —
    # at **21:44:44, 3.12 h late**, squarely inside this schedule's own
    # measured band. It was judged missing at 105 minutes past the slot, while
    # the probe on the same screen reported a **median delay of 3.47 h and a
    # max of 4.86 h**. The data needed to not make that call was already in
    # front of whoever made it. **Do not judge a slot missing before ~6 h.**
    #
    # What remains true: the 09-07 00:xx and 06:xx dumps really never ran, a
    # measured 16.70 h gap. But the 06:xx slot was ~4.7 h AFTER the merge, with
    # no pending tick left to drop, so the edit theory does not explain it
    # either. The likeliest cause is simply that GitHub skipped runs under
    # load, which its own docs allow for. The dispatch rule stays because the
    # asymmetry is extreme — two free runner-minutes against the only
    # off-cluster copy of the database — NOT because an edit is a known cause.
    # Use `slot: manual`, which writes its own key and cannot clobber a
    # rotating schedule slot.
    - cron: '37 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Key slot to write'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - schedule
      dry_run:
        description: 'Dump, encrypt and verify the round-trip without uploading'
        required: false
        default: false
        type: boolean

concurrency:
  # Never two dumps at once: they would race on the same rotating key and could
  # leave a half-written object under it.
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install PostgreSQL 17 client
        # The runner ships the PG16 client. pg_dump refuses to dump a server
        # NEWER than itself, and Supabase upgrades its Postgres majors on its
        # own schedule — so pinning to whatever the runner image happens to
        # carry means the backup silently starts failing on somebody else's
        # release day. A newer pg_dump reads older servers fine, so installing
        # 17 covers today's server and the next upgrade.
        #
        # INSTALLING IT IS NOT ENOUGH, which is what the 2026-09-01 failure
        # taught: the job aborted with "server version: 17.6; pg_dump version:
        # 16.15" AFTER this step had run and reported success. On Debian and
        # Ubuntu `/usr/bin/pg_dump` is `pg_wrapper`, which picks a version from
        # the default CLUSTER rather than from what is installed, so adding 17
        # beside 16 need not change what actually runs. Hence both halves below:
        # put the versioned bin directory first on PATH, then ASSERT the version
        # rather than printing it — a step that installs and hopes is how this
        # failed silently the first time. scripts/backup-database.mjs resolves
        # the versioned binary itself as well, so neither layer is load-bearing
        # alone.
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          version="$(/usr/lib/postgresql/17/bin/pg_dump --version)"
          echo "$version"
          case "$version" in
            *"pg_dump (PostgreSQL) 17."*) ;;
            *) echo "::error::Expected pg_dump 17, got: $version"; exit 1 ;;
          esac

      - name: Install wrangler
        # Only wrangler is needed to upload; `npm ci` would install the whole
        # dependency tree (and run `prisma generate`) to run one CLI.
        #
        # Pinned to the version the lockfile resolves, not a floating `@4`: this
        # job holds DIRECT_URL, BACKUP_PASSPHRASE and the Cloudflare token four
        # times a day, and a floating major would hand all three to whatever
        # wrangler publishes next (security sweep, 2026-09-02).
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")"
          echo "wrangler@$version (from package-lock.json)"
          npm install --no-save --no-audit --no-fund "wrangler@$version"

      - name: Back up the database
        run: node scripts/backup-database.mjs --slot=${{ inputs.slot || 'schedule' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # DIRECT_URL, not DATABASE_URL: pg_dump needs a real session, and a
          # transaction-mode pooler cannot give it a consistent snapshot.
          BACKUP_DATABASE_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET || 'ihype-backups' }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
          # Optional dedicated credential. Set BACKUP_R2_API_TOKEN to keep the
          # deploy token unchanged and revocable on its own; unset, the backup
          # uses the deploy's token. Either way the permission needed is
          # account-wide Workers R2 Storage Write — R2's bucket-scoped
          # "Object Read & Write" is S3-API only and wrangler uses the REST API.
          BACKUP_R2_API_TOKEN: ${{ secrets.BACKUP_R2_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
