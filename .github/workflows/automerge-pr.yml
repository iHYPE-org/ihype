name: Auto-merge PRs

# SECURITY: pull_request_target runs with write permissions and repo secrets.
# This workflow is only safe because it NEVER checks out or executes PR code —
# it just flips the auto-merge bit via the GitHub API. Do not add an
# actions/checkout step (or anything that runs code from the PR head) here;
# that would let a malicious PR run with write access to this repository.
#
# THAT RULE MATTERS MORE SINCE `AUTOMERGE_TOKEN` EXISTS. The job now runs with a
# personal access token that can write Contents and Pull requests across this
# repository, so PR-authored code executing here would be handed far more than
# the scoped GITHUB_TOKEN it replaced. The invariant is the same, the stakes are
# higher: no checkout, no PR scripts, no `npm` anything.
on:
  pull_request_target:
    # `opened` matters for anything opened by a bot: Dependabot labels its PRs
    # at creation and never relabels them, so without this the job could only
    # ever fire on a later synchronize that may never come.
    # `unlabeled` is what lets removing the `hold` label release a PR.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    # Auto-merge is the DEFAULT for every pull request, not an opt-in label
    # (owner, 2026-08-26: "Can we setup automerge when it's green?" / "For all
    # future PRs?"). It was gated on an `automerge` label nobody applied, so it
    # did nothing for months while merged-by-hand was the real workflow.
    #
    # This is only safe because of the required status check on `main`:
    # `--auto` merges when the required checks pass and NEVER merges a red PR.
    # A failing PR sits and waits for a person, exactly as it does today. It is
    # also only safe because CI stopped skipping stages — until 2026-08-06 the
    # browser, Cloudflare and bundle-budget stages were behind a label, so
    # "green" covered about a quarter of the pipeline. Defaulting to auto-merge
    # on top of a partial pipeline would have been the 2026-07-21 incident
    # again, where a grouped PR merged with CI fully red.
    #
    # Three exclusions, and each one is the brake for a different mistake:
    #
    #   1. DRAFTS never auto-merge. That is the mechanism for work in progress —
    #      open it as a draft and it cannot merge itself out from under you, no
    #      matter how green it goes. `ready_for_review` is what arms it.
    #   2. The `hold` LABEL blocks a PR that is already open. Use it for a
    #      change that passes CI but should not land yet — a migration waiting
    #      on a data check, a change timed to something outside the repo.
    #      Removing the label re-arms it (hence `unlabeled` above).
    #   3. A DEPENDABOT MAJOR still needs a human. `dependabot.yml` restricts
    #      the two groups to minor and patch, so a major bump arrives as its own
    #      individual PR with a branch like
    #      `dependabot/npm_and_yarn/typescript-7.0.2`, which matches none of the
    #      group prefixes below. That is deliberate and it is the whole lesson
    #      of the 2026-07-21 incident: three major jumps hid inside one
    #      routine-looking grouped PR. A green pipeline does not prove a major
    #      is safe — it proves nothing it covers broke, and an API-version or
    #      runtime-behaviour change (see `apiVersion` in `src/lib/stripe.ts`)
    #      can typecheck and test clean and still be a decision.
    #
    # Forks are excluded by the head-repo check: a branch in this repository
    # implies write access, a fork PR implies nothing.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'hold') &&
      (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/development-dependencies') ||
        startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/production-dependencies') ||
        startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          # `AUTOMERGE_TOKEN` is what makes the merge actually SHIP. A push made
          # with the built-in GITHUB_TOKEN triggers NO workflows — GitHub's rule
          # for preventing recursive runs — so every PR this job auto-merged
          # produced a push to `main` that fired no deploy, no cache purge and
          # not even the stale-PR refresh. Measured on 2026-08-26: `main` sat
          # three merges ahead of production for 80 minutes with every check
          # green and nothing anywhere reporting it, because CI runs on the free
          # self-hosted runner and stayed healthy while deployment silently
          # stopped. A PAT is a real actor, so its pushes trigger workflows
          # normally.
          #
          # Falls back to GITHUB_TOKEN when the secret is absent so auto-merge
          # keeps working rather than erroring — but note what that costs: the
          # merge lands and nothing deploys. If you see merged commits that
          # never reached production, check whether this secret expired. A
          # fine-grained PAT has an expiry date and its lapse looks exactly like
          # this bug coming back.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # GitHub REFUSES to arm auto-merge on a PR that is already mergeable —
        # the mutation errors with "Pull request is in clean status" rather than
        # merging it. That is reachable here: removing `hold` from a PR whose
        # checks finished long ago fires `unlabeled` against an already-green
        # PR, and the label would look like it did nothing. So fall through to a
        # direct squash, which still goes through branch protection and so still
        # cannot merge a red or unreviewed PR — it is the same guarantee, just
        # evaluated now instead of on the next check completion.
        run: |
          gh pr merge "$PR_URL" --auto --squash \
            || gh pr merge "$PR_URL" --squash
